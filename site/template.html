<title>Itai's Skill Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a friendly card wall. Filter chips + search on top, skill cards in a grid, details open in a side drawer. */
:root {
  --paper: #f1f3ef;
  --card: #fbfcf9;
  --ink: #16191a;
  --muted: #5b625d;
  --line: #d8dcd4;
  --accent: #2741c4;
  --accent-ink: #ffffff;
  --tint: #e6eaf9;
  --ok: #1f7a4d;
  --shade: rgba(16, 19, 18, .38);
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111312; --card: #191c1a; --ink: #e8ebe6; --muted: #a0a7a1;
    --line: #2c302d; --accent: #93a4ff; --accent-ink: #0e1020; --tint: #1f2338;
    --ok: #6fcf9a; --shade: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111312; --card: #191c1a; --ink: #e8ebe6; --muted: #a0a7a1;
  --line: #2c302d; --accent: #93a4ff; --accent-ink: #0e1020; --tint: #1f2338;
  --ok: #6fcf9a; --shade: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body.locked { overflow: hidden; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; }

/* Header */
header.top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 40px 28px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(36px, 6vw, 60px)/.98 var(--display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.lede { max-width: 58ch; margin: 0; font-size: 18px; color: var(--muted); }
.lede b { color: var(--ink); font-weight: 600; }

/* How it works: a real sequence, so the steps are numbered */
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 14.5px; color: var(--muted); }
.steps li::before { content: counter(step); font: 700 15px/1 var(--display); color: var(--accent-ink); background: var(--accent); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.steps b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 20px 4px; border-top: 1px solid var(--line); margin-top: 8px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.search { flex: 1 1 220px; min-width: 0; font: 15px var(--body); padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: baseline; }
.chip .n { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }

/* Groups + cards */
.group { display: grid; gap: 14px; padding-top: 28px; }
.group-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.group-h h2 { font: 700 24px/1.1 var(--display); margin: 0; letter-spacing: -.01em; }
.group-h p { margin: 0; color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.skill {
  display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 14px;
}
.skill:hover { border-color: var(--accent); }
.skill h3 { font: 600 19px/1.2 var(--display); margin: 0; letter-spacing: -.01em; }
.skill p { margin: 0; color: var(--muted); font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.badge { font: 500 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line); }
.badge.own { border-color: var(--accent); color: var(--accent); }
.on { color: var(--ok); }
.on::before { content: "●"; font-size: 9px; margin-right: 5px; vertical-align: 1px; }
.empty { color: var(--muted); padding: 32px 0; font-size: 16px; }

/* Drawer */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 30; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); z-index: 31; overflow-y: auto;
  background: var(--card); border-left: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) 24px;
  display: grid; gap: 22px; align-content: start;
}
.d-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.close { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.close:hover { border-color: var(--accent); }
.drawer h2 { font: 700 clamp(28px, 4vw, 36px)/1.05 var(--display); margin: 0 0 8px; letter-spacing: -.02em; text-wrap: balance; }
.drawer .sum { margin: 0; font-size: 17px; color: var(--muted); }
.box { display: grid; gap: 10px; }
.box h3 { margin: 0; font: 600 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--tint); border-radius: 12px; padding: 14px 16px; font-size: 16px; }
.ask q { quotes: "“" "”"; }
.copy { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-size: 13px; padding: 5px 12px; cursor: pointer; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.how { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.how li { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }
.how li b { font-weight: 600; }
.how li span { color: var(--muted); }
.cmd { display: flex; align-items: center; gap: 10px; min-width: 0; font: 13px/1.3 var(--mono); background: var(--paper); border: 1px solid var(--line); padding: 7px 7px 7px 12px; border-radius: 8px; }
.cmd code { overflow-x: auto; white-space: nowrap; min-width: 0; flex: 1; }
.credit { font-size: 14px; color: var(--muted); margin: 0; }
details.full { border-top: 1px solid var(--line); padding-top: 14px; }
details.full summary { cursor: pointer; font-weight: 600; }
.md { font-size: 15px; line-height: 1.65; padding-top: 6px; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); line-height: 1.2; letter-spacing: -.01em; margin: 1.5em 0 .5em; text-wrap: balance; }
.md h1 { font-size: 22px; } .md h2 { font-size: 19px; } .md h3 { font-size: 16.5px; } .md h4 { font-size: 15px; }
.md code { font: 13px var(--mono); background: var(--paper); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; border-radius: 8px; overflow-x: auto; max-width: 100%; }
.md pre code { background: none; padding: 0; font-size: 12.5px; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.md blockquote { margin: 1em 0; padding-left: 14px; border-left: 2px solid var(--line); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }

footer.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 24px; }

@media (max-width: 760px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static; }
  .lede { font-size: 16.5px; }
  .drawer { border-left: 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: no-preference) {
  .skill, .chip { transition: border-color .12s, background-color .12s; }
  .drawer { animation: slide .2s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="owner-line">Itai Agami</div>
    <h1>Itai's Skill Library</h1>
    <p class="lede" id="lede"></p>
    <ol class="steps">
      <li><div><b>Pick a skill</b>Browse by topic or search for what you need.</div></li>
      <li><div><b>Copy the example</b>Each skill has a ready-made request to start from.</div></li>
      <li><div><b>Ask Claude</b>Paste it in Claude. Skills in your account work right away.</div></li>
    </ol>
  </header>

  <div class="filters">
    <input class="search" id="q" type="search" placeholder="What do you need help with?" autocomplete="off" aria-label="Search skills">
    <div class="chips" id="chips" role="group" aria-label="Topics"></div>
  </div>

  <main id="index" aria-live="polite"></main>

  <footer class="foot">
    <span id="foot-count"></span>
    <span>Files: <a id="repo-link" href="#" target="_blank" rel="noopener"></a></span>
  </footer>
</div>

<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catById = Object.fromEntries(DATA.categories.map((c) => [c.id, c]));

let state = { cat: 'all', q: '', open: null };
try { state.cat = localStorage.getItem('skills.cat') || 'all'; } catch (e) {}
if (state.cat !== 'all' && !catById[state.cat]) state.cat = 'all';

const ready = DATA.skills.filter((s) => s.inAccount).length;
$('lede').innerHTML = `Skills are ready-made instructions that teach Claude how to do a specific job well. There are <b>${DATA.skills.length} here</b>, and <b>${ready}</b> are already turned on in your Claude account. Tap any card to see what it does and how to use it.`;
$('repo-link').href = `https://github.com/${DATA.repo}`;
$('repo-link').textContent = `github.com/${DATA.repo}`;
$('foot-count').textContent = `${DATA.skills.length} skills · ${DATA.skills.filter((s) => s.source === 'own').length} written by Itai`;

function matches(s) {
  if (state.cat !== 'all' && s.category !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return [s.title, s.summary, s.name, s.description, s.try].some((t) => t.toLowerCase().includes(q));
}

function renderChips() {
  const counts = {};
  DATA.skills.forEach((s) => { counts[s.category] = (counts[s.category] || 0) + 1; });
  const items = [{ id: 'all', title: 'All', n: DATA.skills.length }].concat(DATA.categories.map((c) => ({ id: c.id, title: c.title, n: counts[c.id] || 0 })));
  $('chips').innerHTML = items.map((c) => `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${esc(c.title)}<span class="n">${c.n}</span></button>`).join('');
}

function badge(s) {
  const src = DATA.sources[s.source];
  return `<span class="badge ${s.source === 'own' ? 'own' : ''}">${esc(src.label)}</span>`;
}

function renderIndex() {
  const groups = DATA.categories.map((c) => ({ c, list: DATA.skills.filter((s) => s.category === c.id && matches(s)) })).filter((g) => g.list.length);
  if (!groups.length) { $('index').innerHTML = `<p class="empty">Nothing matches “${esc(state.q)}”. Try a shorter word, or choose All.</p>`; return; }
  $('index').innerHTML = groups.map(({ c, list }) => `
    <section class="group">
      <div class="group-h"><h2>${esc(c.title)}</h2><p>${esc(c.blurb)}</p></div>
      <div class="grid">${list.map((s) => `
        <button class="skill" type="button" data-skill="${s.name}">
          <h3>${esc(s.title)}</h3>
          <p>${esc(s.summary)}</p>
          <span class="meta">${badge(s)}${s.inAccount ? '<span class="on">In your Claude</span>' : ''}</span>
        </button>`).join('')}
      </div>
    </section>`).join('');
}

function renderMd(md) {
  if (!window.marked) return `<pre>${esc(md)}</pre>`;
  marked.use({ renderer: { html(t) { return esc(typeof t === 'string' ? t : t.text); } } });
  return marked.parse(md);
}

function cmd(id, text) {
  return `<div class="cmd"><code id="${id}">${esc(text)}</code><button class="copy" type="button" data-copy="${id}">Copy</button></div>`;
}

let lastFocus = null;
function renderDrawer() {
  const s = DATA.skills.find((x) => x.name === state.open);
  $('drawer').hidden = $('shade').hidden = !s;
  document.body.classList.toggle('locked', !!s);
  if (!s) { $('drawer').innerHTML = ''; if (lastFocus) lastFocus.focus(); return; }
  const c = catById[s.category];
  const src = DATA.sources[s.source];
  const note = s.note || src.note;
  const claudeStep = s.inAccount
    ? `<li><b>In the Claude app or claude.ai</b><span>It's already turned on in your account. Just ask, and Claude uses it when it fits. To call it by name, type <code>/${esc(s.name)}</code>.</span></li>`
    : `<li><b>In the Claude app or claude.ai</b><span>Not in your account yet. Download the <a href="https://github.com/${DATA.repo}/tree/main/${esc(s.dir)}" target="_blank" rel="noopener">${esc(s.name)}</a> folder from GitHub, zip it, then add it in Settings → Capabilities → Skills.${s.dir.startsWith('bundles/') ? ' It shares files with the rest of its group, so it works best installed through Claude Code.' : ''}</span></li>`;
  const credit = s.source === 'own'
    ? 'Written by Itai.'
    : `${src.label === 'Adapted' ? 'Adapted from' : 'Made by'} <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.author)}</a>. Free to use under the ${esc(src.license)} licence.`;
  $('drawer').innerHTML = `
    <div class="d-top"><span class="eyebrow">${esc(c.title)}</span><button class="close" type="button" id="close">Close</button></div>
    <div>
      <h2 id="d-title">${esc(s.title)}</h2>
      <p class="sum">${esc(s.summary)}</p>
    </div>
    <div class="box">
      <h3>Try asking</h3>
      <div class="ask"><q id="ask-text">${esc(s.try)}</q><button class="copy" type="button" data-copy="ask-text">Copy</button></div>
    </div>
    <div class="box">
      <h3>How to use it</h3>
      <ul class="how">
        ${claudeStep}
        <li><b>In Claude Code</b><span>Run this once to install the whole ${esc(c.title)} group.</span>
          ${cmd('cmd-install', `/plugin install ${c.plugin} --marketplace ${DATA.repo}`)}
        </li>
      </ul>
    </div>
    <p class="credit">${credit}${note ? ' ' + esc(note) : ''}</p>
    <details class="full">
      <summary>Read the full instructions Claude follows</summary>
      <div class="md">${renderMd(s.body)}</div>
    </details>`;
  $('drawer').scrollTop = 0;
  $('close').focus();
}

function open(name) {
  if (name) lastFocus = document.activeElement;
  state.open = name;
  try { history.replaceState(null, '', name ? '#' + name : location.pathname); } catch (e) {}
  renderDrawer();
}

document.addEventListener('click', async (e) => {
  const chip = e.target.closest('[data-cat]');
  if (chip) { state.cat = chip.dataset.cat; try { localStorage.setItem('skills.cat', state.cat); } catch (err) {} renderChips(); renderIndex(); return; }
  const card = e.target.closest('[data-skill]');
  if (card) { open(card.dataset.skill); return; }
  if (e.target.id === 'close' || e.target.id === 'shade') { open(null); return; }
  const btn = e.target.closest('[data-copy]');
  if (btn) {
    const el = $(btn.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); btn.textContent = 'Copied'; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Selected'; }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
  }
});
$('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderIndex(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) open(null); });

const fromHash = decodeURIComponent(location.hash.slice(1));
if (DATA.skills.some((s) => s.name === fromHash)) state.open = fromHash;
renderChips(); renderIndex(); renderDrawer();
</script>
