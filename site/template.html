<title>Itai's Skill Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a library card catalogue. Category rail + call-numbered index on the left, the open card (full SKILL.md) on the right. */
:root {
  --paper: #f1f3ef;
  --card: #fafbf8;
  --ink: #16191a;
  --muted: #5d645f;
  --line: #d6dad2;
  --accent: #2741c4;
  --accent-ink: #ffffff;
  --tint: #e4e8f8;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111312; --card: #181b19; --ink: #e8ebe6; --muted: #9aa19b;
    --line: #2b2f2c; --accent: #93a4ff; --accent-ink: #0e1020; --tint: #1e2236;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111312; --card: #181b19; --ink: #e8ebe6; --muted: #9aa19b;
  --line: #2b2f2c; --accent: #93a4ff; --accent-ink: #0e1020; --tint: #1e2236;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; }

header.top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 36px 24px; border-bottom: 1px solid var(--ink); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(34px, 6vw, 60px)/.95 var(--display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.lede { max-width: 60ch; margin: 0; color: var(--muted); }
.lede b { color: var(--ink); font-weight: 600; }
.install { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cmd {
  display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%;
  font: 13px/1.3 var(--mono); background: var(--card); border: 1px solid var(--line);
  padding: 8px 8px 8px 12px; border-radius: 6px;
}
.cmd code { overflow-x: auto; white-space: nowrap; min-width: 0; }
.copy {
  flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 4px;
  font: 500 11px/1 var(--mono); padding: 6px 8px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em;
}
.copy:hover { border-color: var(--accent); color: var(--accent); }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; padding-top: 24px; }
.layout.open { grid-template-columns: 200px minmax(0, 380px) minmax(0, 1fr); }

nav.rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.search { width: 100%; font: 14px var(--body); padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); margin-bottom: 12px; }
.cat {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-align: left;
  background: none; border: 0; border-radius: 4px; padding: 7px 8px; cursor: pointer;
}
.cat .n { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cat:hover { background: var(--card); }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cat[aria-pressed="true"] .n { color: inherit; opacity: .7; }

.index { display: flex; flex-direction: column; min-width: 0; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 18px 8px; border-bottom: 1px solid var(--line); }
.group-h:first-child { padding-top: 0; }
.group-h h2 { font: 600 20px/1.1 var(--display); margin: 0; letter-spacing: -.01em; }
.group-h span { font: 12px var(--mono); color: var(--muted); }
.row {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 14px; text-align: left; width: 100%;
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 6px; cursor: pointer;
}
.row:hover { background: var(--card); }
.row[aria-current="true"] { background: var(--tint); }
.call { font: 500 12px/1.6 var(--mono); color: var(--muted); grid-row: span 2; font-variant-numeric: tabular-nums; }
.row .name { font: 500 14px/1.4 var(--mono); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.row .desc { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.tag.own { border-color: var(--accent); color: var(--accent); }
.empty { color: var(--muted); padding: 24px 6px; }

article.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-width: 0;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start;
  max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px)); overflow: auto;
}
.card-head { display: grid; gap: 12px; padding: 20px 22px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.close { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; font: 500 12px var(--mono); }
.card h3 { font: 700 clamp(22px, 3vw, 30px)/1.05 var(--display); margin: 0; letter-spacing: -.02em; overflow-wrap: anywhere; }
.card .about { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 13px; }
.facts dt { font: 500 11px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.files { font: 12px/1.6 var(--mono); color: var(--muted); }
.md { padding: 8px 22px 28px; font-size: 14.5px; line-height: 1.65; }
.md > * { max-width: 72ch; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; margin: 1.6em 0 .5em; }
.md h1 { font-size: 24px; } .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
.md code { font: 13px var(--mono); background: var(--paper); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; border-radius: 6px; overflow-x: auto; max-width: 100%; }
.md pre code { background: none; padding: 0; font-size: 12.5px; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.md blockquote { margin: 1em 0; padding-left: 14px; border-left: 2px solid var(--line); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }

footer.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 24px; }

@media (max-width: 1080px) {
  .layout.open { grid-template-columns: 200px minmax(0, 1fr); }
  .layout.open article.card {
    position: fixed; inset: 0; z-index: 20; max-height: none; border-radius: 0; border: 0;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
}
@media (max-width: 720px) {
  .layout, .layout.open { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  nav.rail { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .search { flex: 1 1 100%; margin-bottom: 4px; }
  .cat { border: 1px solid var(--line); padding: 6px 10px; }
  .row { grid-template-columns: 52px minmax(0, 1fr); }
  .card-head, .md { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .cat { transition: background-color .12s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="owner-line">Skill library</div>
    <h1>Itai's Skill Library</h1>
    <p class="lede" id="lede"></p>
    <div class="install">
      <div class="cmd"><code id="cmd-add"></code><button class="copy" type="button" data-copy="cmd-add">Copy</button></div>
    </div>
  </header>

  <div class="layout" id="layout">
    <nav class="rail" aria-label="Categories">
      <input class="search" id="q" type="search" placeholder="Search skills" autocomplete="off" aria-label="Search skills">
      <div id="cats" style="display:contents"></div>
    </nav>
    <main class="index" id="index" aria-live="polite"></main>
    <article class="card" id="card" hidden></article>
  </div>

  <footer class="foot">
    <span id="foot-count"></span>
    <span>Source: <a id="repo-link" href="#" target="_blank" rel="noopener"></a></span>
    <span>Third-party skills keep their MIT licences. See THIRD_PARTY_NOTICES.md.</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CALL = { design: 'DSN', marketing: 'MKT', sales: 'SLS', business: 'BIZ', ai: 'AI', projects: 'PRJ' };

const catById = Object.fromEntries(DATA.categories.map((c) => [c.id, c]));
DATA.skills.forEach((s) => {
  const peers = DATA.skills.filter((p) => p.category === s.category);
  s.call = (CALL[s.category] || s.category.slice(0, 3).toUpperCase()) + '·' + String(peers.indexOf(s) + 1).padStart(2, '0');
});

let state = { cat: 'all', q: '', open: null };
try { state.cat = localStorage.getItem('skills.cat') || 'all'; } catch (e) {}
if (state.cat !== 'all' && !catById[state.cat]) state.cat = 'all';

const own = DATA.skills.filter((s) => s.source === 'own').length;
$('owner-line').textContent = DATA.owner + ' · ' + DATA.repo;
$('lede').innerHTML = `<b>${DATA.skills.length} skills</b> in ${DATA.categories.length} shelves. ${own} written by Itai, the rest adapted or collected from open-source skill sets. Open any card to read the full instructions, or install a whole shelf into Claude Code.`;
$('cmd-add').textContent = `/plugin marketplace add ${DATA.repo}`;
$('repo-link').href = `https://github.com/${DATA.repo}`;
$('repo-link').textContent = `github.com/${DATA.repo}`;
$('foot-count').textContent = `${DATA.skills.length} skills · ${own} original`;

function matches(s) {
  if (state.cat !== 'all' && s.category !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return s.name.includes(q) || s.description.toLowerCase().includes(q);
}

function renderCats() {
  const counts = {};
  DATA.skills.forEach((s) => { counts[s.category] = (counts[s.category] || 0) + 1; });
  const items = [{ id: 'all', title: 'All shelves', n: DATA.skills.length }].concat(DATA.categories.map((c) => ({ id: c.id, title: c.title, n: counts[c.id] || 0 })));
  $('cats').innerHTML = items.map((c) => `<button class="cat" type="button" data-cat="${c.id}" aria-pressed="${state.cat === c.id}"><span>${esc(c.title)}</span><span class="n">${c.n}</span></button>`).join('');
}

function sourceTag(s) {
  const src = DATA.sources[s.source];
  return `<span class="tag ${s.source === 'own' ? 'own' : ''}">${esc(src.label)}</span>`;
}

function renderIndex() {
  const groups = DATA.categories.map((c) => ({ c, list: DATA.skills.filter((s) => s.category === c.id && matches(s)) })).filter((g) => g.list.length);
  if (!groups.length) { $('index').innerHTML = `<p class="empty">No skill matches “${esc(state.q)}”. Try a shorter word, or pick All shelves.</p>`; return; }
  $('index').innerHTML = groups.map(({ c, list }) => `
    <div class="group-h"><h2>${esc(c.title)}</h2><span>${esc(c.plugin)}</span></div>
    ${list.map((s) => `
      <button class="row" type="button" data-skill="${s.name}" aria-current="${state.open === s.name}">
        <span class="call">${s.call}</span>
        <span class="name">/${esc(s.name)} ${sourceTag(s)}</span>
        <span class="desc">${esc(s.description)}</span>
      </button>`).join('')}`).join('');
}

function renderMd(md) {
  if (!window.marked) return `<pre>${esc(md)}</pre>`;
  marked.use({ renderer: { html(t) { return esc(typeof t === 'string' ? t : t.text); } } });
  return marked.parse(md);
}

function renderCard() {
  const s = DATA.skills.find((x) => x.name === state.open);
  $('layout').classList.toggle('open', !!s);
  $('card').hidden = !s;
  if (!s) { $('card').innerHTML = ''; return; }
  const c = catById[s.category];
  const src = DATA.sources[s.source];
  const gh = `https://github.com/${DATA.repo}/tree/main/skills/${s.name}`;
  const installId = 'cmd-install';
  $('card').innerHTML = `
    <div class="card-head">
      <div class="card-top"><span class="eyebrow">${s.call} · ${esc(c.title)}</span><button class="close" type="button" id="close">Close</button></div>
      <h3>/${esc(s.name)}${s.argumentHint ? ` <span style="font:400 15px var(--mono);color:var(--muted)">${esc(s.argumentHint)}</span>` : ''}</h3>
      <p class="about">${esc(s.description)}</p>
      <div class="cmd"><code id="${installId}">/plugin install ${esc(c.plugin)}@${esc(DATA.marketplace)}</code><button class="copy" type="button" data-copy="${installId}">Copy</button></div>
      <dl class="facts">
        <dt>Source</dt><dd>${esc(src.label)}${src.url ? ` · <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.url.replace('https://github.com/', ''))}</a>` : ''}</dd>
        <dt>Licence</dt><dd>${esc(src.license)}</dd>
        ${s.note || src.note ? `<dt>Note</dt><dd>${esc(s.note || src.note)}</dd>` : ''}
        <dt>Files</dt><dd class="files">${s.files.map(esc).join(' · ')}</dd>
        <dt>Repo</dt><dd><a href="${gh}" target="_blank" rel="noopener">skills/${esc(s.name)}</a></dd>
      </dl>
    </div>
    <div class="md">${renderMd(s.body)}</div>`;
  $('card').scrollTop = 0;
}

function render() { renderCats(); renderIndex(); renderCard(); }

function open(name) {
  state.open = name;
  try { history.replaceState(null, '', name ? '#' + name : location.pathname); } catch (e) {}
  renderIndex(); renderCard();
}

document.addEventListener('click', async (e) => {
  const cat = e.target.closest('[data-cat]');
  if (cat) { state.cat = cat.dataset.cat; try { localStorage.setItem('skills.cat', state.cat); } catch (err) {} renderCats(); renderIndex(); return; }
  const row = e.target.closest('[data-skill]');
  if (row) { open(row.dataset.skill); return; }
  if (e.target.id === 'close') { open(null); return; }
  const btn = e.target.closest('[data-copy]');
  if (btn) {
    const el = $(btn.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); btn.textContent = 'Copied'; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Selected'; }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
  }
});
$('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderIndex(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) open(null); });

const fromHash = decodeURIComponent(location.hash.slice(1));
if (DATA.skills.some((s) => s.name === fromHash)) state.open = fromHash;
render();
</script>
