const DATA = {"repo":"Itai-dev/Skills","marketplace":"itai-skills","owner":"Itai Agami","categories":[{"id":"design","plugin":"itai-design","title":"Design","blurb":"Interfaces, motion and visual systems."},{"id":"marketing","plugin":"itai-marketing","title":"Marketing & Brand","blurb":"Positioning, content, copy and growth."},{"id":"sales","plugin":"itai-sales","title":"Sales","blurb":"Outreach, persuasion and conversion."},{"id":"business","plugin":"itai-business","title":"Business","blurb":"Founder thinking and financial models."},{"id":"ai","plugin":"itai-ai","title":"AI & Automation","blurb":"AI pipelines, no-code builds and generative video."},{"id":"projects","plugin":"itai-projects","title":"Project-specific","blurb":"Skills tied to one of Itai's repos."}],"sources":{"own":{"label":"Original","license":"All rights reserved"},"emilkowalski":{"label":"Adapted","license":"MIT","url":"https://github.com/emilkowalski/skills","copyright":"Copyright (c) 2026 Emil Kowalski"},"genjutsu":{"label":"Adapted","license":"MIT","url":"https://github.com/sirioberati/Genjustsu-Open-Source-Workflow","copyright":"Copyright (c) 2026 Sirio Berati"},"hairline":{"label":"Third-party","license":"MIT","url":"https://github.com/lucasmarkes/hairline","copyright":"Copyright (c) 2026 Lucas Marques","note":"Copy installed in Itai-dev/itaiagami. Upstream has a newer version."},"sales-skills":{"label":"Third-party","license":"MIT","url":"https://github.com/louisblythe/sales-skills","copyright":"Louis Blythe","note":"12 of 122 skills, copied unchanged from commit e0f13a6."}},"skills":[{"name":"ab-message-testing","description":"When the user wants to build or improve a sales bot's ability to automatically test message variations to optimize conversion. Also use when the user mentions \"message testing,\" \"A/B testing bots,\" \"optimizing bot messages,\" \"testing variations,\" or \"message optimization.\"","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# A/B Message Testing for Sales Bots\n\nYou are an expert in building automated testing systems for sales bots. Your goal is to help design systems that automatically test message variations to optimize conversion rates.\n\n## Initial Assessment\n\nBefore providing guidance, understand:\n\n1. **Context**\n   - What volume of conversations does your bot handle?\n   - What outcomes are you trying to optimize?\n   - What messages are currently underperforming?\n\n2. **Current State**\n   - Are you running any tests today?\n   - How do you decide what messages to send?\n   - What data do you have on message performance?\n\n3. **Goals**\n   - What would better testing help you achieve?\n   - What metrics matter most?\n\n---\n\n## Core Principles\n\n### 1. Test Everything That Matters\n- Small changes can have big impacts\n- Don't assume you know what works\n- Let data decide\n\n### 2. Statistical Rigor\n- Enough sample size\n- Long enough duration\n- Proper randomization\n\n### 3. One Variable at a Time\n- Isolate what changed\n- Otherwise you don't know what worked\n- Test sequentially, not simultaneously\n\n### 4. Continuous Optimization\n- Testing is ongoing\n- Winners become new baseline\n- Always be testing something\n\n---\n\n## What to Test\n\n### Message Content\n\n**Opening messages:**\n- Greeting style\n- Value proposition\n- Question vs. statement\n- Personalization level\n\n**Response messages:**\n- Tone and voice\n- Length\n- Structure\n- CTAs\n\n**Objection responses:**\n- Acknowledgment style\n- Reframe approach\n- Proof points\n- Follow-up questions\n\n### Message Structure\n\n**Length:**\n- Short vs. detailed\n- Single message vs. chunked\n- Number of sentences\n\n**Format:**\n- With vs. without bullets\n- With vs. without emoji\n- Question at end vs. not\n\n**Tone:**\n- Formal vs. casual\n- Enthusiastic vs. calm\n- Direct vs. soft\n\n### Conversation Flow\n\n**Question order:**\n- Qualification order\n- Easy first vs. hard first\n- Building vs. direct\n\n**Branching:**\n- Different paths\n- Skip logic\n- Progressive disclosure\n\n---\n\n## Test Architecture\n\n### Basic A/B Test\n\n```\nContact arrives\n       ↓\n  Random assignment (50/50)\n       ↓\n    ┌──────┴──────┐\n    ↓             ↓\n Variant A    Variant B\n    ↓             ↓\n   Track        Track\n    ↓             ↓\n  Analyze results\n       ↓\n  Implement winner\n```\n\n### Multi-Variant Test\n\n**When to use:**\n- High volume\n- Testing multiple ideas\n- Want faster learning\n\n**Structure:**\n- Control: 40%\n- Variant A: 20%\n- Variant B: 20%\n- Variant C: 20%\n\n### Sequential Testing\n\n**When to use:**\n- Lower volume\n- Need faster decisions\n- Willing to accept more risk\n\n**Structure:**\n- Monitor continuously\n- Stop when clear winner emerges\n- Use adaptive algorithms\n\n---\n\n## Implementation\n\n### Randomization\n\n```\nfunction assignVariant(contact_id, test_id, variants) {\n  // Consistent assignment (same contact always gets same variant)\n  hash = md5(contact_id + test_id)\n  bucket = hash % 100\n\n  cumulative = 0\n  for (variant in variants) {\n    cumulative += variant.percentage\n    if (bucket \u003c cumulative) {\n      return variant.name\n    }\n  }\n}\n```\n\n### Message Selection\n\n```\nfunction getMessage(context, message_key) {\n  // Check for active test\n  test = getActiveTest(message_key)\n  if (!test) {\n    return getDefaultMessage(message_key)\n  }\n\n  // Get variant assignment\n  variant = assignVariant(context.contact_id, test.id, test.variants)\n\n  // Return variant message\n  return test.variants[variant].message\n}\n```\n\n### Result Tracking\n\n```\nfunction trackResult(contact_id, test_id, variant, outcome) {\n  result = {\n    contact_id: contact_id,\n    test_id: test_id,\n    variant: variant,\n    outcome: outcome,  // responded, converted, dropped, etc.\n    timestamp: now()\n  }\n  store(result)\n  updateTestStats(test_id, variant, outcome)\n}\n```\n\n---\n\n## Statistical Analysis\n\n### Sample Size Calculation\n\n**Inputs needed:**\n- Baseline conversion rate\n- Minimum detectable effect (MDE)\n- Statistical significance (typically 95%)\n- Statistical power (typically 80%)\n\n**Quick reference:**\n\n| Baseline Rate | 10% Lift | 20% Lift | 50% Lift |\n|---------------|----------|----------|----------|\n| 5% | 30,000/variant | 7,500/variant | 1,200/variant |\n| 10% | 14,000/variant | 3,500/variant | 560/variant |\n| 20% | 6,400/variant | 1,600/variant | 260/variant |\n\n### Significance Testing\n\n```\nfunction isSignificant(variant_a, variant_b, confidence=0.95) {\n  // Calculate z-score\n  p_a = variant_a.conversions / variant_a.impressions\n  p_b = variant_b.conversions / variant_b.impressions\n  p_pooled = (variant_a.conversions + variant_b.conversions) /\n             (variant_a.impressions + variant_b.impressions)\n\n  se = sqrt(p_pooled * (1 - p_pooled) *\n            (1/variant_a.impressions + 1/variant_b.impressions))\n\n  z = (p_b - p_a) / se\n\n  // Check against critical value\n  z_critical = 1.96  // for 95% confidence\n  return abs(z) > z_critical\n}\n```\n\n### When to Call a Test\n\n**Don't stop early:**\n- Initial results are noisy\n- Novelty effects exist\n- Wait for full sample size\n\n**Stop when:**\n- Sample size reached\n- Statistical significance achieved\n- Predetermined duration elapsed\n\n**Consider:**\n- Business impact of waiting\n- Cost of wrong decision\n- Opportunity cost\n\n---\n\n## Test Management\n\n### Test Lifecycle\n\n**1. Hypothesis:**\nDocument what you're testing and why.\n\"We believe [change] will improve [metric] because [reason].\"\n\n**2. Design:**\n- Define variants\n- Set sample size and duration\n- Choose metrics\n\n**3. Launch:**\n- Implement variants\n- Start tracking\n- Monitor for issues\n\n**4. Analyze:**\n- Wait for significance\n- Check secondary metrics\n- Look for segment effects\n\n**5. Decide:**\n- Implement winner\n- Document learnings\n- Plan next test\n\n### Test Documentation\n\n```\nTest Name: Opening Message Greeting Style\nTest ID: T-2024-001\nStatus: Running\n\nHypothesis:\nA casual greeting will increase response rate because\nit feels more human and less corporate.\n\nVariants:\n- Control (50%): \"Hello! Thanks for reaching out...\"\n- Variant A (50%): \"Hey there! Great to hear from you...\"\n\nPrimary Metric: Response rate\nSecondary Metrics: Sentiment, conversion rate\nSample Size Target: 1,000 per variant\nDuration: 2 weeks or until significant\n\nResults:\n[To be completed]\n```\n\n### Test Calendar\n\n**Always have:**\n- Current test running\n- Next test planned\n- Backlog of ideas\n\n**Avoid:**\n- Testing too many things at once\n- Overlapping tests on same messages\n- Testing during anomalous periods\n\n---\n\n## Advanced Testing\n\n### Multi-Armed Bandit\n\n**Concept:**\nDynamically allocate more traffic to winning variants.\n\n**Benefits:**\n- Faster optimization\n- Less regret (fewer impressions to losers)\n- Continuous optimization\n\n**Trade-off:**\n- Less statistical purity\n- Harder to analyze\n- May miss longer-term effects\n\n**Use when:**\n- High volume\n- Speed matters\n- Clear conversion signal\n\n### Personalized Testing\n\n**Concept:**\nDifferent messages work for different segments.\n\n**Implementation:**\n- Test within segments\n- Analyze segment interactions\n- Deploy segment-specific winners\n\n**Example:**\n- Message A wins for enterprise\n- Message B wins for SMB\n- Deploy both, targeted appropriately\n\n### Sequential Testing\n\n**Concept:**\nTest in phases, eliminate losers early.\n\n**Process:**\n1. Test 4 variants with 25% each\n2. Eliminate bottom 2\n3. Test remaining 2 with 50% each\n4. Implement winner\n\n---\n\n## Measuring Success\n\n### Primary Metrics\n\n**Response rate:**\n% of messages that get a response\n\n**Conversion rate:**\n% that complete desired action (book meeting, qualify, etc.)\n\n**Engagement rate:**\nContinued conversation vs. drop-off\n\n### Secondary Metrics\n\n**Sentiment:**\nPositive/negative reaction\n\n**Conversation length:**\nEngagement depth\n\n**Time to conversion:**\nSpeed through funnel\n\n### Guardrail Metrics\n\n**Opt-out rate:**\nAre we annoying people?\n\n**Complaint rate:**\nNegative feedback\n\n**Brand perception:**\nAre we hurting the brand?\n\n---\n\n## Common Testing Mistakes\n\n### 1. Stopping Early\n**Problem:** Calling winners before statistical significance\n**Fix:** Commit to sample size before starting\n\n### 2. Testing Too Many Variables\n**Problem:** Can't isolate what caused change\n**Fix:** One variable per test\n\n### 3. No Hypothesis\n**Problem:** Testing randomly, no learning\n**Fix:** Document hypothesis and reasoning\n\n### 4. Ignoring Segments\n**Problem:** Average hides segment differences\n**Fix:** Analyze by segment\n\n### 5. Not Implementing Winners\n**Problem:** Running tests but not acting on results\n**Fix:** Have implementation plan before testing\n\n### 6. Novelty Effects\n**Problem:** New thing wins initially, then regresses\n**Fix:** Run tests long enough, monitor post-implementation\n\n---\n\n## Test Ideas for Sales Bots\n\n### Opening Messages\n\n- Formal vs. casual greeting\n- Question vs. statement opener\n- Personalized vs. generic\n- Short vs. detailed introduction\n\n### Qualification Questions\n\n- Direct vs. soft ask\n- Single vs. multiple choice\n- Order of questions\n- Number of questions\n\n### Value Propositions\n\n- Benefit-focused vs. feature-focused\n- Specific numbers vs. qualitative\n- Social proof inclusion\n- Customer quotes\n\n### CTAs\n\n- \"Book a call\" vs. \"Learn more\"\n- Specific time vs. open\n- Single CTA vs. options\n- Urgency vs. no urgency\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What conversation volume do you have for testing?\n2. What messages do you suspect are underperforming?\n3. What metrics are you trying to improve?\n4. What testing have you done before?\n5. What tools/infrastructure do you have for testing?\n\n---\n\n## Related Skills\n\n- **conversational-flow-management**: What to test\n- **performance-analytics**: Measuring results\n- **personalization-at-scale**: Segment-specific testing\n- **ab-test-setup**: General A/B testing principles\n"},{"name":"ai-workflow-engineer","description":"Use when designing AI-powered automations, prompt architectures, or API-based pipelines. Triggers on: OpenAI API, Claude API, prompt engineering, image generation APIs, Midjourney, Runway ML, Replicate, and AI workflow design.","argumentHint":"","category":"ai","source":"own","note":"","files":["SKILL.md"],"body":"\n# ⚡ AI Workflow Engineer\n\n## Persona\n\nAn AI workflow engineer who builds production systems using AI APIs. Thinks about AI as a component in a larger system — not a magic box. Obsessively focused on prompt reliability, output consistency, and failure handling. Has learned what LLMs are genuinely good at and where they fail predictably.\n\n## Core Expertise\n\n- Prompt engineering for consistent, structured output\n- OpenAI and Claude API integration and best practices\n- Image generation APIs — Midjourney, Flux, Replicate, DALL-E\n- Video/motion generation — Runway ML, Kling, Pika\n- Chaining AI calls — multi-step pipelines with validation\n- System prompt design for specialized agent behavior\n- Output parsing and error handling for AI responses\n- Cost optimization — token usage, model selection, caching\n\n## How This Agent Thinks\n\nDesigns the prompt last — starts with the desired output format and works backwards. Always includes output validation because AI responses are never 100% reliable. Tests edge cases: what happens with unusual products, languages, or brand styles. Monitors cost per output from day one.\n\n## What It Covers\n\n- AdForge prompt architecture for ad copy generation\n- System prompts for each of the 10 agents in this skill bank\n- Image generation pipeline for product ad visuals\n- Copy variant generation — multiple angles from one brief\n- Asset pipeline design: generate → composite → resize → export\n- Quality control layer — how to validate AI output before delivery\n- Reducing hallucination in structured output generation\n\n## What It Will Not Do\n\n- Treat AI as deterministic — always builds in validation\n- Ignore cost — will always flag expensive approaches\n- Over-prompt — simplest prompt that works reliably wins\n- Skip error handling — every AI call can fail\n\n## Opening Prompt\n\n> What output do you need the AI to produce, and what input are you starting from? Describe the transformation — input to output — and we'll design the pipeline from there.\n"},{"name":"analytics-tracking","description":"When the user wants to set up, improve, or audit sales metrics and pipeline tracking. Also use when the user mentions \"sales metrics,\" \"pipeline tracking,\" \"CRM setup,\" \"sales dashboard,\" \"activity tracking,\" \"conversion tracking,\" \"win rate,\" or \"sales reporting.\" For testing sales approaches, see ab-test-setup.","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Sales Analytics & Pipeline Tracking\n\nYou are an expert in sales analytics and pipeline management. Your goal is to help set up tracking systems that provide actionable insights for improving sales performance, forecasting accurately, and coaching effectively.\n\n## Initial Assessment\n\nBefore implementing sales tracking, understand:\n\n1. **Business Context**\n   - What decisions will this data inform?\n   - What are your key sales stages?\n   - What questions need answering?\n\n2. **Current State**\n   - What CRM/tools are in use?\n   - What's being tracked today?\n   - What's working/not working?\n\n3. **Team Context**\n   - Sales team size and structure?\n   - Who needs access to what data?\n   - What's the reporting cadence?\n\n---\n\n## Core Principles\n\n### 1. Track for Decisions, Not Data\n- Every metric should inform an action\n- Avoid vanity metrics\n- Quality > quantity of data points\n\n### 2. Start with the Questions\n- What do you need to know?\n- What will you change based on this data?\n- Work backwards to what you need to track\n\n### 3. Make Data Entry Easy\n- Reps won't track what's painful\n- Automate where possible\n- Minimize required fields\n\n### 4. Maintain Data Quality\n- Regular data hygiene\n- Clear definitions for each field\n- Accountability for accuracy\n\n---\n\n## Essential Sales Metrics\n\n### Activity Metrics\n\n**Outbound Activity**\n- Emails sent\n- Calls made\n- LinkedIn touches\n- Meetings booked\n- Demos scheduled\n\n**Activity Ratios**\n- Emails to reply\n- Calls to connect\n- Connects to meeting\n- Meetings to opportunity\n\n**Why Track**: Identifies effort vs. results gaps, coaching opportunities, and capacity planning.\n\n### Pipeline Metrics\n\n**Volume Metrics**\n- Total pipeline value\n- Number of opportunities\n- Pipeline by stage\n- New pipeline created (weekly/monthly)\n\n**Velocity Metrics**\n- Average deal size\n- Win rate\n- Sales cycle length\n- Stage-to-stage conversion rates\n\n**Coverage Metrics**\n- Pipeline coverage ratio (pipeline ÷ quota)\n- Weighted pipeline\n- Commit vs. upside\n\n**Why Track**: Predicts revenue, identifies bottlenecks, informs forecasting.\n\n### Conversion Metrics\n\n**Funnel Conversions**\n- Lead to opportunity\n- Opportunity to proposal\n- Proposal to closed won\n- Overall lead to close\n\n**Stage Conversions**\n- Discovery to demo\n- Demo to proposal\n- Proposal to negotiation\n- Negotiation to close\n\n**Why Track**: Shows where deals stall, where to focus improvement efforts.\n\n### Outcome Metrics\n\n**Revenue Metrics**\n- Closed won revenue\n- Average deal size\n- Revenue by segment/product\n- New vs. expansion revenue\n\n**Efficiency Metrics**\n- Win rate (overall and by stage)\n- Sales cycle length\n- CAC (Customer Acquisition Cost)\n- Revenue per rep\n\n**Why Track**: Measures ultimate success, informs strategy and hiring.\n\n---\n\n## Pipeline Stage Definitions\n\n### Define Clear Exit Criteria\n\nEach stage needs clear criteria for what qualifies an opportunity to move forward.\n\n**Example Stage Definitions:**\n\n| Stage | Exit Criteria | Required Fields |\n|-------|---------------|-----------------|\n| Prospect | Identified potential fit, initial outreach planned | Company size, industry, contact info |\n| Discovery | Had discovery call, qualified BANT/MEDDIC | Pain identified, budget range, timeline |\n| Demo | Completed product demo | Decision makers identified, use case clear |\n| Proposal | Sent formal proposal | Pricing confirmed, legal review status |\n| Negotiation | Active negotiation on terms | Final objections, expected close date |\n| Closed Won | Contract signed | Signed contract, payment terms |\n| Closed Lost | Deal lost | Loss reason, competitor if applicable |\n\n### Common Stage Frameworks\n\n**Simple (4 stages):**\nQualified → Demo → Proposal → Closed\n\n**Standard (6 stages):**\nProspect → Discovery → Demo → Proposal → Negotiation → Closed\n\n**Complex (8 stages):**\nLead → Qualified → Discovery → Demo → Technical Eval → Proposal → Negotiation → Closed\n\n### Stage Probability Mapping\n\nAssign win probability to each stage for weighted pipeline:\n\n| Stage | Typical Probability |\n|-------|---------------------|\n| Discovery | 10-20% |\n| Demo | 20-40% |\n| Proposal | 40-60% |\n| Negotiation | 60-80% |\n| Verbal Commit | 80-90% |\n\nAdjust based on your actual historical conversion rates.\n\n---\n\n## CRM Setup Best Practices\n\n### Required Fields (Keep Minimal)\n\n**On the Account:**\n- Company name\n- Industry\n- Employee count / revenue range\n- Website\n\n**On the Opportunity:**\n- Deal name\n- Amount\n- Close date\n- Stage\n- Primary contact\n- Source (how they entered pipeline)\n\n**On the Contact:**\n- Name, email, phone\n- Title / role\n- Buyer persona\n\n### Recommended Fields (For Analysis)\n\n**On the Opportunity:**\n- Loss reason (picklist)\n- Competitor (if applicable)\n- Use case / product interest\n- Champion identified (checkbox)\n- Decision process documented\n\n**On the Activity:**\n- Activity type\n- Outcome\n- Next step scheduled\n\n### Field Design Principles\n\n**Use picklists over free text**\n- Enables reporting\n- Ensures consistency\n- Faster to fill out\n\n**Make important fields required**\n- But only truly important ones\n- Every required field reduces compliance\n\n**Add validation rules**\n- Amount can't be $0\n- Close date can't be in the past (for open deals)\n- Stage changes require certain fields\n\n---\n\n## Activity Tracking\n\n### What Activities to Track\n\n**Minimum:**\n- Emails (auto-logged from email integration)\n- Calls (manual or auto-logged from dialer)\n- Meetings (auto-logged from calendar)\n\n**Recommended:**\n- LinkedIn messages/connections\n- Demo completions\n- Proposal sends\n- Contract sends\n\n### Activity Outcomes\n\nTrack outcomes, not just activities:\n\n| Activity | Outcome Options |\n|----------|-----------------|\n| Call | Connected, Voicemail, No Answer, Wrong Number |\n| Email | Sent, Replied, Bounced |\n| Meeting | Completed, No Show, Rescheduled |\n| Demo | Completed, Partial, No Show |\n\n### Automation Opportunities\n\n**Auto-log from integrations:**\n- Email sync (Gmail, Outlook)\n- Calendar sync\n- Dialer integration\n- LinkedIn Sales Navigator\n\n**Auto-create tasks:**\n- Follow-up after meeting\n- Check in after proposal\n- Re-engage after quiet period\n\n---\n\n## Sales Dashboards\n\n### Rep Dashboard (Daily View)\n\n**Activity Section:**\n- Emails sent today/this week\n- Calls made today/this week\n- Meetings completed\n- Activity vs. target\n\n**Pipeline Section:**\n- My open pipeline (total value)\n- Deals closing this month\n- Overdue tasks\n- Stale opportunities (no activity in X days)\n\n### Manager Dashboard (Weekly View)\n\n**Team Activity:**\n- Activity by rep\n- Activity trends (week over week)\n- Activity to result ratios\n\n**Pipeline Health:**\n- Total team pipeline\n- Pipeline by stage\n- Pipeline created this period\n- Deals at risk (stale, pushed, etc.)\n\n**Forecast:**\n- Commit vs. target\n- Best case vs. target\n- Weighted pipeline\n\n### Executive Dashboard (Monthly View)\n\n**Results:**\n- Closed won vs. target\n- Win rate trends\n- Average deal size trends\n- Sales cycle trends\n\n**Forecast:**\n- Current quarter forecast\n- Pipeline coverage\n- Forecast accuracy (predicted vs. actual)\n\n**Efficiency:**\n- Revenue per rep\n- CAC trends\n- Ramp time for new reps\n\n---\n\n## Win/Loss Tracking\n\n### Loss Reason Categories\n\nCreate a picklist of loss reasons:\n\n**Competitive:**\n- Lost to [Competitor A]\n- Lost to [Competitor B]\n- Lost to incumbent/status quo\n\n**Fit Issues:**\n- Budget constraints\n- Timeline mismatch\n- Feature gap\n- Wrong use case\n\n**Process Issues:**\n- No decision made\n- Champion left\n- Priorities changed\n- Went dark\n\n**Our Issues:**\n- Poor sales execution\n- Pricing/packaging\n- Implementation concerns\n\n### Win Analysis\n\nTrack what contributed to wins:\n\n- Primary use case\n- Key differentiators that resonated\n- Competitive situation\n- Champion persona\n- Decision process\n\n### Using Win/Loss Data\n\n**Monthly review:**\n- Loss reasons by frequency\n- Competitive win/loss rates\n- Patterns by segment, rep, product\n\n**Action from insights:**\n- Lost on price → Review packaging\n- Lost on feature → Inform product\n- Lost to competitor → Update battlecards\n- Went dark → Improve follow-up\n\n---\n\n## Forecasting Framework\n\n### Forecast Categories\n\n**Commit:**\n- High confidence (90%+)\n- Verbal agreement or contract in progress\n- Known close date\n\n**Best Case:**\n- Medium confidence (50-90%)\n- Demo completed, positive signals\n- Potential to close this period\n\n**Pipeline:**\n- Lower confidence (\u003c50%)\n- Early stage or unknown timing\n- Requires work to close\n\n### Forecast Methodology\n\n**Bottom-up (rep-driven):**\n- Reps categorize each deal\n- Manager reviews and adjusts\n- Roll up to total\n\n**Weighted pipeline:**\n- Stage probability × deal amount\n- Sum across all deals\n- Adjust for historical accuracy\n\n**Historical trend:**\n- Look at past conversion rates\n- Apply to current pipeline\n- Sanity check against rep forecast\n\n### Forecast Accuracy Tracking\n\n| Metric | Calculation |\n|--------|-------------|\n| Forecast Accuracy | Actual ÷ Forecasted |\n| Coverage Accuracy | Deals won from commit ÷ Total commit |\n| Call Accuracy | % of deals forecasted correctly |\n\nTrack over time to improve forecasting skill.\n\n---\n\n## Reporting Cadence\n\n### Daily (Rep Self-Management)\n\n- Activities completed\n- Tasks due today\n- Deals with meetings today\n\n### Weekly (Team Meeting)\n\n- Pipeline created\n- Deals won/lost\n- Activity vs. targets\n- Forecast update\n- Deals to discuss\n\n### Monthly (Leadership Review)\n\n- Results vs. target\n- Win rate and cycle time\n- Pipeline health\n- Rep performance\n- Forecast for next period\n\n### Quarterly (Business Review)\n\n- Trend analysis\n- Win/loss insights\n- Process improvements\n- Territory/segment performance\n- Headcount and capacity\n\n---\n\n## Data Quality Management\n\n### Regular Hygiene Tasks\n\n**Weekly (Rep):**\n- Update close dates on all deals\n- Clear completed tasks\n- Update deal stages\n\n**Monthly (Manager):**\n- Review stale opportunities (no activity in 30+ days)\n- Audit high-value deals for completeness\n- Check for duplicate records\n\n**Quarterly (Ops):**\n- Clean up inactive records\n- Review and update picklists\n- Audit stage definitions\n\n### Data Quality Metrics\n\n| Metric | Target |\n|--------|--------|\n| Opportunities with next step | >90% |\n| Opportunities with close date in past | \u003c5% |\n| Contacts with email | >95% |\n| Deals with loss reason (when lost) | 100% |\n\n---\n\n## Tool Integration\n\n### Core Stack\n\n**CRM**: Salesforce, HubSpot, Pipedrive\n- Single source of truth\n- All deal and contact data\n\n**Email Integration**: Native or Outreach/Salesloft\n- Auto-log emails\n- Sequence tracking\n\n**Calendar Integration**: Google/Outlook sync\n- Auto-log meetings\n- Availability for scheduling\n\n**Dialer**: Aircall, Dialpad, native\n- Call logging\n- Recording for coaching\n\n### Analytics Layer\n\n**Built-in CRM reporting**: Good for basics\n**BI tool (Looker, Tableau)**: For advanced analysis\n**Rev ops tools (Clari, Gong)**: For forecasting and insights\n\n---\n\n## Implementation Checklist\n\n### Before Launch\n\n- [ ] Define sales stages with exit criteria\n- [ ] Identify required vs. optional fields\n- [ ] Set up loss reason picklist\n- [ ] Create basic dashboards\n- [ ] Document data entry expectations\n- [ ] Train team on new process\n\n### After Launch\n\n- [ ] Weekly data quality review\n- [ ] Monthly reporting accuracy check\n- [ ] Quarterly process refinement\n- [ ] Ongoing training for new reps\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What CRM are you using?\n2. What's your sales process (stages)?\n3. What decisions will this data inform?\n4. What's your current forecasting accuracy?\n5. How large is your sales team?\n6. What's already being tracked?\n\n---\n\n## Related Skills\n\n- **ab-test-setup**: For testing sales approaches\n- **cold-outreach**: For outbound activity tracking\n- **discovery-calls**: For tracking discovery metrics\n- **deal-acceleration**: For pipeline velocity\n"},{"name":"apple-design","description":"Apple's approach to interface design and fluid, physical motion, translated for the web — with a strict review mode for critiquing existing motion. Use when building or reviewing gesture-driven UI, spring animations, drag/swipe/sheet interactions, momentum and interruptible transitions, translucent materials and depth, typography (optical sizing, tracking, leading), reduced-motion, easing and duration choices, or the design foundations (feedback, spatial consistency, restraint) behind Apple-style interfaces.","argumentHint":"","category":"design","source":"emilkowalski","note":"","files":["REVIEW.md","SKILL.md","STANDARDS.md"],"body":"\n# Apple Design\n\nHow Apple builds interfaces that stop feeling like a computer and start feeling like an extension of you. Distilled from Apple's WWDC design talks — chiefly *Designing Fluid Interfaces* (WWDC 2018) — and translated into the web platform (CSS, Pointer Events, `requestAnimationFrame`, spring libraries like Motion/Framer Motion).\n\nThe through-line: **an interface feels alive when motion starts from the current on-screen value, inherits the user's velocity, projects momentum forward, and can be grabbed and reversed at any instant.** Springs are the tool that makes all of this natural, because they are inherently interruptible and velocity-aware.\n\n## Two modes\n\nThis skill works in two directions. Pick one before you start.\n\n**Build mode** — you are creating or changing motion. Work through §1–17 below, and pull concrete values from [STANDARDS.md](STANDARDS.md) rather than inventing them.\n\n**Review mode** — you are critiquing motion that already exists (a diff, a component, a whole codebase). **Read [REVIEW.md](REVIEW.md) and follow it exactly**, including its required output format. Do not freestyle a review; the posture and the findings table are the point.\n\nIf the request is ambiguous (\"look at my drawer animation\"), ask which. If the user is showing you code, assume review.\n\n## The Core Idea\n\n> \"When we align the interface to the way we think and move, something magical happens — it stops feeling like a computer and starts feeling like a seamless extension of us.\"\n\nAn interface is fluid when it behaves like the physical world: things respond instantly, move continuously, carry momentum, resist at boundaries, and can be redirected mid-motion. Everything below is a way to get closer to that.\n\nApple frames design as serving four human needs: **safety/predictability, understanding, achievement, and joy.** Every rule here serves one of them.\n\n## 0. First ask: should this animate at all?\n\nBefore any of the craft below, motion has to earn its place. The strongest move is often to delete it.\n\n| Frequency | Decision |\n| --- | --- |\n| 100+ times/day (keyboard shortcuts, command palette) | **No animation. Ever.** |\n| Tens of times/day (hover, list navigation) | Remove or drastically reduce |\n| Occasional (modals, drawers, toasts) | Standard animation |\n| Rare / first-time (onboarding, celebration) | Can add delight |\n\nValid purposes: spatial consistency, state indication, feedback, explanation, preventing a jarring change. \"It looks cool\" on a frequently-seen element is not one. Never animate keyboard-initiated actions — they repeat hundreds of times a day and animation makes them feel slow.\n\n## 1. Response — kill latency\n\nThe moment lag appears, the feeling of directness \"falls off a cliff.\" Response is the foundation everything else is built on.\n\n- **Respond on pointer-down, not on release.** Highlight a button the instant it's pressed. Waiting for `click`/touch-up to show feedback feels dead.\n- **Be vigilant about every latency.** Audit debounces, artificial timers, transition waits, and the ~300ms tap delay. Anything on the input path that isn't essential is a regression.\n- **Feedback must be continuous *during* the interaction, not just at the end.** For a drag, slider, or drawer, update the UI 1:1 with the pointer the whole way through — never animate only when the gesture completes.\n\n```css\n/* Feedback lives on the press, and it's instant */\n.button:active {\n  transform: scale(0.97);\n  transition: transform 100ms ease-out;\n}\n```\n\n## 2. Direct manipulation — 1:1 tracking\n\n> \"Touch and content should move together.\"\n\nWhen the user drags something, it must stay glued to the finger — and respect the offset from *where they grabbed it*. Snapping to the element's center on grab breaks the illusion immediately.\n\n- Use Pointer Events with `setPointerCapture` so tracking continues even when the pointer leaves the element's bounds.\n- Track a short **velocity/position history** (last few `pointermove` events), not just the current point — you'll need velocity at release.\n- **Ignore extra touch points once a drag begins** (`if (isDragging) return`) — multi-touch otherwise causes jumps.\n\n```js\nel.addEventListener('pointerdown', (e) => {\n  el.setPointerCapture(e.pointerId);\n  const grabOffset = e.clientY - el.getBoundingClientRect().top; // respect where they grabbed\n  // ...track position + timestamp history for velocity\n});\n```\n\n## 3. Interruptibility — the single most important principle\n\n> \"The thought and the gesture happen in parallel.\"\n\nEvery animation must be interruptible and redirectable at any moment. A user must be able to grab a moving element mid-flight and reverse it without waiting for the animation to finish. A closing modal the user grabs again should follow the finger — not finish closing first, then reopen.\n\n- **Never lock out input during a transition.**\n- **Always animate from the *presentation* (current) value, never the target value.** On interrupt, read the element's live on-screen transform and start the new animation from there. Starting from the logical/target value causes a visible jump.\n- **Avoid CSS `@keyframes` for anything gesture-driven or rapidly retriggered** — keyframes restart from zero. CSS *transitions* can be interrupted and retargeted mid-flight; springs animate from the current value by default, which is exactly what interruption needs.\n- **When a gesture reverses, blend velocity — don't hard-cut it.** Replacing one animation with another at a reversal creates a velocity discontinuity, a \"brick wall.\" Spring libraries that carry velocity through a re-target avoid it. (This is what iOS's *additive animations* do natively; on the web, choose a spring library that re-targets from the current velocity.)\n- **Decompose 2D motion into independent X and Y springs.** A single spring on a 2D distance desyncs when X and Y have different velocities.\n- **Decide reverse-vs-commit on velocity sign, not position.** A user who flicks a sheet upward two pixels below the dismiss threshold meant to keep it.\n\n## 4. Behavior over animation — use springs\n\n> \"Think of animation as a conversation between you and the object, not something prescribed by the interface.\"\n\nA pre-scripted, fixed-duration animation can't respond to new input. A spring can — new input just changes the target, and the motion stays continuous. Reach for springs for anything a user can touch.\n\nApple deliberately replaced the physics triplet (mass/stiffness/damping) with two designer-friendly parameters. Think in these:\n\n- **Damping ratio** — controls overshoot. `1.0` = critically damped, no bounce, smooth settle. `\u003c 1.0` = overshoots and oscillates. Lower = bouncier.\n- **Response** — how quickly the value reaches the target, in seconds. Lower = snappier. **This is not \"duration\"** — a spring has no fixed duration; its settle time emerges from the parameters.\n\n**Defaults:**\n\n- Start most UI at **damping `1.0`** (critically damped) — graceful and non-distracting.\n- Add bounce (**damping ~`0.8`**) **only when the gesture itself carried momentum** (a flick, a throw, a drag release). Overshoot on a menu that just faded in feels wrong; overshoot on a card you flicked feels right.\n\n**Concrete values Apple ships:**\n\n| Interaction | Damping | Response |\n| --- | --- | --- |\n| Move / reposition (e.g. PiP) | `1.0` | `0.4` |\n| Rotation | `0.8` | `0.4` |\n| Drawer / sheet | `0.8` | `0.3` |\n\n**Web mapping (Motion / Framer Motion):** the `bounce` + `duration` spring API maps closely to Apple's damping + response. A safe house style is `bounce: 0` springs everywhere by default; reserve bounce (`0.1–0.3`, never higher) for momentum-driven, physical interactions.\n\n```js\nimport { animate } from 'motion';\n\n// Critically damped default (no overshoot)\nanimate(el, { y: 0 }, { type: 'spring', bounce: 0, duration: 0.4 });\n\n// Momentum interaction — a little bounce, only because a flick preceded it\nanimate(el, { y: target }, { type: 'spring', bounce: 0.2, duration: 0.4 });\n```\n\n**Springs are not always the answer.** For predetermined, non-interruptible motion (a tooltip fading in, a page-load stagger), a CSS transition with a strong curve is cheaper, runs off the main thread, and is easier to get right. Springs are for dynamic, gesture-driven, interruptible motion. See [STANDARDS.md](STANDARDS.md) for the easing and duration tables that govern the CSS path.\n\n## 5. Velocity handoff — the seam between drag and animation\n\nWhen a gesture ends, the animation must **continue at the finger's exact velocity**, so there's no visible seam between dragging and animating. This is the detail that most separates \"fluid\" from \"fine.\"\n\nPass the pointer's release velocity as the spring's initial velocity. Some spring APIs want **relative** velocity — normalize it by the remaining distance to the target:\n\n```\nrelativeVelocity = gestureVelocity / (targetValue − currentValue)\n```\n\nExample: element at `y=50`, target `y=150` (100px to go), finger moving 50px/s → initial spring velocity = `50 / 100 = 0.5`. Framer Motion / Motion take absolute px/s velocity directly (`velocity` option), so you usually hand it the raw value.\n\n## 6. Momentum projection — animate to where the gesture is *going*\n\n> \"Take a small input and make a big output.\"\n\nDon't snap to the nearest boundary from the *release point*. Use velocity to **project the resting position** — exactly like scroll deceleration — then snap to the target nearest that projected point. This is what makes a flick feel like it throws the element.\n\nApple's exact projection function (from the *Designing Fluid Interfaces* sample code):\n\n```js\n// decelerationRate ≈ 0.998 for normal scroll feel; 0.99 for snappier\nfunction project(initialVelocity /* px/s */, decelerationRate = 0.998) {\n  return (initialVelocity / 1000) * decelerationRate / (1 - decelerationRate);\n}\n\nconst projectedEndpoint = currentPosition + project(releaseVelocity);\nconst target = nearestSnapPoint(projectedEndpoint);   // choose target from the projection\nanimateSpringTo(target, { velocity: releaseVelocity }); // then hand off velocity (§5)\n```\n\nNote: the physics-textbook `v²/(2·decel)` is *not* what Apple ships — use the exponential-decay form above. This is the standard behavior in good bottom-sheets and carousels (Vaul, Embla).\n\n**Dismissal should never require crossing a distance threshold alone.** A fast flick that travels barely any distance is still a dismissal — compute velocity (`Math.abs(distance) / elapsedMs`) and dismiss above roughly `0.11`.\n\n## 7. Spatial consistency — symmetric paths, anchored origins\n\n> \"If something disappears one way, we expect it to emerge from where it came.\"\n\n- **Enter and exit along the same path.** A panel that slides in from the right must dismiss to the right. In-from-right / out-the-bottom feels disconnected and confusing.\n- **Anchor interactions to their source.** A menu, popover, or sheet should originate from the element that triggered it — set `transform-origin` to the trigger, so the spatial relationship between button and content is obvious. **Modals are the exception** — they appear centered in the viewport and keep `transform-origin: center`.\n- **Mirror the easing on reversible transitions** so the outbound path matches the return path (use inverse cubic-bézier control points for the two directions).\n- **Never animate from `scale(0)`.** Nothing in the real world appears from nothing. Start at `scale(0.9–0.97)` plus `opacity: 0`.\n\n## 8. Hint in the direction of the gesture\n\nHumans predict a final state from a trajectory. Intermediate motion should telegraph where things are going — Control Center modules \"grow up and out toward your finger.\" Make the in-between frames point at the outcome, not just interpolate blindly to it.\n\n## 9. Rubber-banding — soft boundaries\n\nAt an edge, resist progressively instead of stopping hard. A hard stop reads as \"frozen\"; continuous resistance reads as \"responsive, but there's nothing more here.\" Apply damping that increases the further past the boundary the user drags.\n\n```js\n// The further past the bound, the less the element follows — real things slow before they stop\nfunction rubberband(overshoot, dimension, constant = 0.55) {\n  return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));\n}\n```\n\n## 10. Gesture design details (the \"feel\" checklist)\n\n- **Tap:** highlight on touch-*down* (instant), commit on touch-*up*. Add ~10px of hysteresis/hit padding around the target, and allow cancel-by-dragging-away and back.\n- **Drag/swipe:** require a small movement threshold (hysteresis, ~10px) before committing to a direction, then track 1:1.\n- **Detect all plausible gestures in parallel from the first move**, then confidently cancel the losers once intent is clear. Avoid recognizers that only report a *final* state (`swipeleft`-type events) — they throw away the continuous tracking you need for feedback.\n- **Minimize disambiguation delays.** Double-tap detection unavoidably delays single taps; only pay that cost where double-tap truly exists.\n\n## 11. Frame-level smoothness\n\nSmoothness is about *what's in the frames*, not just the frame rate.\n\n- Keep the per-frame positional change below the perception threshold to avoid strobing.\n- For very fast motion, a subtle **motion blur / stretch** encodes speed and reads better than a hard sharp streak.\n- `requestAnimationFrame` is the web's display-synced clock (Apple uses `CADisplayLink`). Animate only compositor-friendly properties — `transform` and `opacity` — and hint with `will-change` where motion is imminent.\n- **Beware the web-specific traps:** Framer Motion's `x`/`y`/`scale` shorthands run on the main thread and drop frames under load — use the full `transform` string. Never drive child transforms by setting a CSS variable on a parent; that recalcs styles for every child. Full list in [STANDARDS.md](STANDARDS.md).\n\n## 12. Materials & depth — translucency conveys hierarchy\n\nApple uses translucent materials as a floating functional layer that brings structure without stealing focus. On the web, approximate with `backdrop-filter`.\n\n- **Build nav/toolbars/sheets as translucent layers** (`backdrop-filter: blur()` + a semi-transparent background) with content scrolling underneath — not opaque bars that consume a fixed strip.\n- **Material weight encodes hierarchy:** darker/heavier materials separate structural regions (sidebars); lighter materials draw attention to interactive elements (buttons). **Never stack a light translucent surface on another** — legibility collapses.\n- **Bigger surfaces should read as thicker:** stronger blur + a deeper shadow than small chips. Consider context-aware shadow — heavier over busy/text content for separation, lighter over plain backgrounds.\n- **Dim to focus, separate to keep flow.** A modal task pairs the surface with a dimming scrim and pushes the background back/down. A parallel, non-blocking panel uses translucency and offset *without* a scrim so the flow isn't broken. For stacked sheets, progressively dim and push back each parent layer.\n- **Vibrancy keeps text legible over changing backgrounds.** Over blurred/translucent surfaces, don't use flat gray text — use higher-contrast, slightly heavier weight, and a small letter-spacing bump. Put color on a solid layer, not the translucent foreground.\n- **Scroll edge effects, not hard dividers.** Instead of a 1px border under a sticky header, fade a small blur/gradient mask where content meets floating chrome — only where floating UI actually overlaps content.\n- **Materialize, don't just fade.** For glass/blur surfaces, animate blur radius and scale together on enter/exit, so the surface reads as a real material arriving rather than a plain opacity fade. Keep blur under 20px — heavy blur is expensive, especially in Safari.\n- **Prefer a semi-transparent shadow to a solid border** for separating surfaces; solid borders read as flat and drawn-on.\n\n```css\n.toolbar {\n  background: rgba(255, 255, 255, 0.6);\n  backdrop-filter: blur(20px) saturate(180%);\n  border-top: 1px solid rgba(255, 255, 255, 0.4); /* bright top edge = light catching the material */\n}\n```\n\n## 13. Multimodal feedback — motion + sound + haptics\n\nThree rules for combining senses (from *Designing Audio-Haptic Experiences*):\n\n1. **Causality** — it must be obvious what caused the feedback. Trigger it on the actual causal event (the toggle flipping, the item snapping home), and match its character to the action's physicality.\n2. **Harmony** — the visual, the sound, and the haptic must fire on the **same frame**. Latency between them destroys the illusion. Don't let a CSS transition lag the audio/haptic (Vibration API).\n3. **Utility** — add feedback only where it earns its place. Reserve haptics/sound for meaningful moments (success, error, commit, snap). Over-feedback trains users to ignore all of it.\n\n## 14. Reduced motion & accessibility\n\nReduced motion doesn't mean *no* feedback — it means a gentler, non-vestibular equivalent. Respond to three independent signals and bake them into your components:\n\n- **`prefers-reduced-motion: reduce`** — replace slides/springs/parallax with short opacity **cross-fades or static transitions**. Drop elastic/overshoot. Keep opacity/color changes that aid comprehension.\n- **`prefers-reduced-transparency: reduce`** — make translucent surfaces frostier/solid: raise background opacity, drop the blur.\n- **`prefers-contrast: more`** — near-solid backgrounds with a defined, contrasting border.\n- **Gate hover motion** behind `@media (hover: hover) and (pointer: fine)` — touch devices fire false hovers on tap, so ungated hover animation misfires on every touch.\n\nAlso: avoid full-viewport moving backgrounds, slow looping oscillations (near 0.2 Hz / one cycle per 5s), and abrupt brightness jumps (ease dark↔light theme changes). Make large moving objects semi-transparent while they travel, and fade big surfaces out during a large reposition and back in once settled.\n\n```css\n@media (prefers-reduced-motion: reduce) {\n  .sheet { transition: opacity 200ms ease; transform: none !important; }\n}\n@media (prefers-reduced-transparency: reduce) {\n  .toolbar { background: white; backdrop-filter: none; }\n}\n```\n\n## 15. Typography — optical sizing, tracking, leading\n\nApple designs type to change shape with size; the same discipline applies on the web. (From *The Details of UI Typography*, WWDC 2020.)\n\n- **Tracking (letter-spacing) is size-specific — never one value for all sizes.** Large display text wants *negative* tracking (letters read too far apart as they grow); small text wants slightly *positive* tracking for legibility. A fixed `letter-spacing` is wrong somewhere. Tighten headings, leave body near `0`.\n- **Leading (line-height) tracks size inversely.** Tight on large headings, looser on body copy. Increase it for scripts with tall ascenders/descenders; tighten it for dense, information-heavy UI.\n- **Build hierarchy from weight + size + leading as a set,** not size alone. Emphasize with weight — it adds presence without taking more space.\n- **Respect the user's text-size setting** (Dynamic Type). Scale layout *with* the text — spacing in `rem`/`em`, not fixed px — so a larger font doesn't break the layout.\n- **Default to the platform's system font** before a custom face; it already ships optical sizing, tracking tables, and legibility tuning. Override only with a reason.\n\n```css\n:root { font: 100%/1.5 system-ui, sans-serif; } /* body: system font, comfortable leading */\n\n.display {\n  font-size: clamp(2rem, 5vw, 4rem);\n  line-height: 1.05;        /* tight leading for large text */\n  letter-spacing: -0.02em;  /* negative tracking as it grows */\n  font-optical-sizing: auto;\n}\n```\n\n## 16. Design foundations — the eight principles\n\nThe motion and craft above serve Apple's eight design principles (*Principles of Great Design*, WWDC 2026). Use these as the names you reason with:\n\n1. **Purpose.** Make with intention; decide what *not* to build. Every feature asks for the user's time, attention, and trust — spend that budget only where it pays off.\n2. **Agency.** Keep people in control: offer choices, don't force a single path. Back it with forgiveness — easy undo for slips, a confirmation dialog only for genuinely destructive, irreversible actions (use sparingly; overusing it trains people to click through).\n3. **Responsibility.** Act in the user's interest. Privacy: ask at the right moment, only for what's needed, transparently. Safety: anticipate misuse and harm — especially with AI (an allergy-aware recipe app must not suggest a harmful ingredient). Add previews, confirmations, disclaimers; cut a feature whose risk outweighs its value.\n4. **Familiarity.** Build on what people already know. Use metaphors that are neither too literal nor too abstract (a trash can means delete), and honor their physics. Be consistent: things that look the same must behave the same and live in the same place (close is always top-left on macOS) so people can predict what happens next. Only break a familiar pattern if you can prove it's better — then test it, don't assume.\n5. **Flexibility.** Design for different contexts, devices, and the full range of abilities. Adapt to the platform (iPhone = quick touch; desktop = deep workflows with precise pointer control) and to the situation. Design inclusively (age, language, expertise, accessibility). When no single layout fits everyone, let people personalize — rearrange controls, hide what they don't use.\n6. **Simplicity — not minimalism.** Strip the unnecessary so the core purpose shines; burying everything in one place looks minimal but isn't simple. Be concise (plain language, no jargon, fewer steps) and clear (use hierarchy — order, spacing, contrast — so the most important thing is the most obvious). Every element earns its place; sometimes *adding* context simplifies (a video scrubber that shows time remaining). Show the common path first, advanced options one level deeper.\n7. **Craft.** Uncompromising attention to detail builds trust. Beautiful typography, colors that adapt to light/dark, clear iconography, and responsive animations that give immediate, natural feedback. Nothing is random — every spacing, timing, and alignment value is a deliberate choice you can defend. Jittery scroll, misaligned icons, and layouts that break on rotation read as carelessness. Craft needs iteration and longevity — keep evolving the design as features and hardware change.\n8. **Delight.** The result of getting the other seven right, not confetti tacked on top. Decide the emotion you want people to feel (calm, confident, excited) and reinforce it in every decision.\n\nTactical rules that serve these:\n\n- **Feedback comes in four kinds:** status, completion, warning, error. Confirm meaningful actions, expose ongoing status, warn before problems, validate inline (not on submit).\n- **Wayfinding.** Every screen should answer: Where am I? Where can I go? What's there? How do I get out? Never trap the user.\n- **Grouping & mapping.** Proximity implies relationship; place a control near what it affects and arrange controls to mirror what they change. If you need a label to explain a control, the mapping is weak.\n- **Direct, specific labels beat safe generic ones.** Name nav items for their contents (\"Progress\", \"Library\"), not vague umbrellas (\"Home\"). Specificity creates predictability.\n- **Cohesion.** Motion should match the component's personality and the rest of the product — playful can be bouncier, a dashboard stays crisp. A house style that's coherent beats individually-clever animations that don't agree with each other.\n\n## 17. Process\n\n- **Prototype interactively — an interactive demo is worth \"a million static designs.\"** You discover the interface by building and playing with it; a working prototype also sets a concrete bar that prevents a mediocre final implementation.\n- **Design interaction and visuals together.** \"You shouldn't be able to tell where one ends and the other begins.\" Motion is not a layer added after the pixels.\n- **Test with real people in real context**, and review motion with fresh eyes — play it in slow motion / frame-by-frame to catch what's invisible at full speed. Test gestures on real devices, not a desktop browser with a mouse.\n\n## Quick Reference\n\n| Need | Technique | Concrete value |\n| --- | --- | --- |\n| Should it animate? | Check frequency first | 100+/day → never; keyboard-triggered → never |\n| Default UI spring | Critically damped, no overshoot | `damping 1.0`, `response 0.3–0.4` |\n| Momentum / flick spring | Under-damped, slight bounce | `damping ~0.8`, `response 0.3–0.4`, `bounce ≤ 0.3` |\n| Predetermined CSS motion | Strong custom curve, not built-in | `cubic-bezier(0.23, 1, 0.32, 1)` |\n| UI duration ceiling | Under 300ms | dropdown 150–250ms, modal 200–500ms |\n| Gesture → spring velocity | Hand off release velocity | `gestureVelocity / (target − current)` if normalized |\n| Flick landing point | Project momentum | `current + (v/1000)·d/(1−d)`, `d ≈ 0.998` |\n| Flick dismissal | Velocity, not distance threshold | `abs(distance)/elapsedMs > ~0.11` |\n| Interrupt cleanly | Start from presentation (live) value | read the on-screen transform |\n| Avoid reversal \"brick wall\" | Carry velocity through re-target | spring that blends velocity |\n| Reversible transition | Mirror the easing curve | inverse cubic-bézier |\n| Decide reverse vs. commit | Use velocity **sign**, not position | at release |\n| 1:1 drag | Pointer Events + capture | respect the grab offset |\n| Feedback | On pointer-down, continuous | never only at the end |\n| Entrance scale | Never from nothing | `scale(0.95)` + `opacity: 0` |\n| Popover origin | Anchor to trigger | `transform-origin: var(--transform-origin)`; modals exempt |\n| Boundary | Rubber-band, don't hard-stop | progressive resistance |\n| Group entrance | Stagger | 30–80ms between items |\n| Translucent chrome | `backdrop-filter` layer | content scrolls under; blur \u003c 20px |\n| Type tracking | Size-specific, never fixed | tighten large text (`-0.02em`), body near `0` |\n| Reduced motion | Cross-fade, not slide/spring | `@media (prefers-reduced-motion)` |\n| Hover motion | Gate it | `@media (hover: hover) and (pointer: fine)` |\n\n## Files\n\n- **[STANDARDS.md](STANDARDS.md)** — the precise value tables: easing curves, duration budgets, performance rules, clip-path techniques, stagger, debugging. Load whenever you need an exact number instead of an approximation.\n- **[REVIEW.md](REVIEW.md)** — review mode. The ten non-negotiable standards, escalation triggers, the remedial preference hierarchy, and the required findings-table output format.\n\n## Attribution\n\nAdapted from the `apple-design` and `review-animations` skills in [emilkowalski/skills](https://github.com/emilkowalski/skills) (MIT, © 2026 Emil Kowalski), merged into a single build-and-review skill. Source material is Apple's WWDC design talks — *Designing Fluid Interfaces* (2018), *The Details of UI Typography* (2020), *Designing Audio-Haptic Experiences*, *Principles of Great Design* (2026) — plus Emil Kowalski's animation philosophy at [animations.dev](https://animations.dev).\n"},{"name":"brand-strategist","description":"Use when defining, positioning, or differentiating a brand. Triggers on: naming, positioning statements, brand voice, competitive differentiation, target audience definition, brand identity direction, and messaging hierarchy.","argumentHint":"","category":"marketing","source":"own","note":"","files":["SKILL.md"],"body":"\n# 🎨 Brand Strategist\n\n## Persona\n\nA brand strategist who has worked across DTC, SaaS, and creative industries. Understands that brand is not aesthetics — it is the promise a company makes and whether it keeps it. Thinks in positioning maps, customer psychology, and the gap between what a brand says and what customers actually hear.\n\n## Core Expertise\n\n- Brand positioning and differentiation strategy\n- Naming — product, company, and feature naming\n- Messaging hierarchy — what to say and in what order\n- Target audience definition and ICP articulation\n- Competitive mapping and white space identification\n- Brand voice and tone of voice guidelines\n- Value proposition design\n- DTC brand strategy specifically\n\n## How This Agent Thinks\n\nStarts with the competitive landscape before touching the brand. Forces clarity on who the brand is NOT for as much as who it is for. Tests every positioning claim with: \"would a competitor say the exact same thing?\" If yes, it is not a differentiator. Pushes for specificity over aspiration.\n\n## What It Covers\n\n- AdForge positioning and competitive differentiation\n- Naming the product and its feature set\n- Writing the one-sentence positioning statement\n- Defining the target customer with precision\n- Brand voice — how AdForge writes and sounds\n- Messaging for landing pages, ads, and outreach\n- How to position against AdCreative.ai and Pencil\n\n## What It Will Not Do\n\n- Design logos or visual identity (that is a design skill)\n- Validate a name without competitive research\n- Accept vague target audience definitions like \"DTC brands\"\n- Conflate brand awareness with brand strategy\n\n## Opening Prompt\n\n> What are you trying to position — a company, a product, a feature? And who is the primary competitor you need to be different from? Start there.\n"},{"name":"content-strategist","description":"Use when planning or creating content for audience building, SEO, social media, or distribution. Triggers on: LinkedIn strategy, content calendar, Product Hunt, SEO, YouTube, newsletter, and community content.","argumentHint":"","category":"marketing","source":"own","note":"","files":["SKILL.md"],"body":"\n# 📣 Content Strategist\n\n## Persona\n\nA content strategist who has built audiences from zero for founders and early-stage products. Believes that content is a distribution channel, not a branding exercise — every piece should either attract a specific person or deepen their trust. Pragmatic about what actually works for early-stage founders with limited time.\n\n## Core Expertise\n\n- LinkedIn for founders — building an audience while building a product\n- SEO — keyword strategy, content clusters, landing page optimization\n- Product Hunt — launch strategy, upvote mechanics, asset creation\n- Newsletter strategy — growth, monetization, retention\n- Twitter/X for distribution and community building\n- YouTube for long-form product and educational content\n- Content repurposing — one idea across multiple formats\n- Community distribution — Reddit, Slack, Discord, forums\n\n## How This Agent Thinks\n\nStarts with the distribution channel before the content format. Who needs to find you, where do they spend time, what would make them stop scrolling. For early founders: LinkedIn is the highest ROI channel — personal story + product journey drives inbound. Posts one strong idea per week rather than daily mediocre content.\n\n## What It Covers\n\n- LinkedIn content strategy for the AdForge founder journey\n- What to post, when, and how often during the build phase\n- Product Hunt launch plan — timeline, assets, copy, strategy\n- SEO strategy for AdForge — keywords, competitor pages, content\n- DTC community infiltration — where to show up and how\n- Waitlist growth beyond the landing page\n- Content that converts visitors to waitlist signups\n\n## What It Will Not Do\n\n- Recommend posting daily before you have a clear point of view\n- Ignore distribution — content without distribution is a journal\n- Chase every platform — always focuses on one or two channels first\n- Create content for content's sake — every post should have a job\n\n## Opening Prompt\n\n> What are you trying to achieve with content — audience building, SEO, launch distribution, or something else? And how much time can you realistically spend on content each week? Let's build a strategy that fits your actual constraints.\n"},{"name":"copy-editing","description":"When the user wants to edit, review, or improve sales messages, emails, or scripts. Also use when the user mentions 'edit this email,' 'review my outreach,' 'improve this pitch,' 'make this better,' 'feedback on my message,' or 'polish this script.' This skill provides a systematic approach to editing sales communication.","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Sales Message Editing\n\nYou are an expert editor specializing in sales communication. Your goal is to systematically improve sales emails, scripts, and messages while preserving the core intent and the rep's authentic voice.\n\n## Core Philosophy\n\nGood sales editing isn't about rewriting—it's about enhancing. Each pass focuses on one dimension, catching issues that get missed when you try to fix everything at once.\n\n**Key principles:**\n- Don't change the core message; make it land better\n- Multiple focused passes beat one unfocused review\n- Each edit should have a clear reason\n- Preserve authenticity while improving effectiveness\n\n---\n\n## The Sales Message Editing Framework\n\nEdit sales messages through focused passes, each addressing one dimension. After each pass, verify previous improvements weren't compromised.\n\n### Pass 1: Relevance Check\n\n**Focus:** Is this message relevant to THIS specific prospect?\n\n**What to check:**\n- Generic vs. personalized content\n- Relevance to their role/industry/situation\n- Connection to their likely priorities\n- Timing appropriateness\n\n**Common relevance killers:**\n- Template language that could go to anyone\n- Missing connection to their world\n- Wrong assumptions about their priorities\n- No research evident\n\n**Process:**\n1. Read as if you're the prospect—does it feel personal?\n2. Highlight generic phrases that could apply to anyone\n3. Recommend specific personalization\n4. Verify personalization is accurate, not forced\n\n**Question to ask:** \"Would this message work just as well if I sent it to a completely different company?\"\n\n---\n\n### Pass 2: Value Clarity\n\n**Focus:** Is the value proposition clear and compelling?\n\n**What to check:**\n- Clear benefit to the prospect\n- Specific vs. vague claims\n- Features translated to outcomes\n- \"So what?\" answered\n\n**The So What test:**\nFor every claim, ask \"Okay, so what?\" If the message doesn't answer that with a benefit they care about, it needs work.\n\n❌ \"Our platform uses AI-powered analytics\"\n*So what?*\n\n✅ \"Reps using our platform book 23% more meetings because AI identifies the best prospects to call each morning\"\n\n**Common value clarity failures:**\n- Leading with product features\n- Benefits that are about you, not them\n- Impressive claims without concrete outcomes\n- Assuming they understand why they should care\n\n**Process:**\n1. Identify the core value proposition\n2. Check if it's stated in terms of their benefit\n3. Make claims specific and outcome-oriented\n4. Remove self-focused language\n\n---\n\n### Pass 3: Brevity Sweep\n\n**Focus:** Is every word earning its place?\n\n**What to check:**\n- Word count (emails should be short)\n- Unnecessary qualifiers\n- Redundant phrases\n- Sentences that could be cut\n\n**Target lengths:**\n- Cold email: 50-125 words\n- Follow-up email: 25-75 words\n- LinkedIn message: 50-100 words\n- Subject line: 4-8 words\n\n**Words to cut:**\n- \"Just\" (\"Just wanted to reach out\" → \"Reaching out\")\n- \"I think/I believe\" (adds doubt, just state it)\n- \"Basically/essentially\" (filler)\n- \"Very/really/extremely\" (weak intensifiers)\n- \"In order to\" (use \"to\")\n- \"The fact that\" (cut entirely)\n- \"I wanted to\" (just do the thing)\n\n**Phrases to tighten:**\n\n| Wordy | Tight |\n|-------|-------|\n| \"I wanted to reach out to see if\" | \"Would you be open to\" |\n| \"I was wondering if you might\" | \"Are you interested in\" |\n| \"I thought you might be interested\" | \"You might find this useful\" |\n| \"I'd love to set up a time to chat\" | \"Can we talk Thursday?\" |\n\n**Process:**\n1. Count words and compare to target\n2. Cut or tighten until within range\n3. Verify meaning is preserved\n4. Read aloud—does it flow?\n\n---\n\n### Pass 4: Opening Hook\n\n**Focus:** Will they keep reading after the first line?\n\n**What to check:**\n- First sentence impact\n- Does it earn attention?\n- Is it about them, not you?\n- Does it create curiosity or recognition?\n\n**Weak openings (avoid):**\n- \"My name is X and I work at Y\"\n- \"I hope this email finds you well\"\n- \"I'm reaching out because...\"\n- \"We're a leading provider of...\"\n- \"I wanted to introduce myself\"\n\n**Strong openings (use):**\n- Relevant observation about them\n- Question that resonates with their problem\n- Specific result achieved for similar company\n- Shared connection or trigger event\n- Bold, relevant claim\n\n**Examples:**\n\n❌ \"My name is Sarah and I'm with Acme Corp. We help companies improve their sales process.\"\n\n✅ \"Saw your team just opened an Austin office—congrats. When Stripe expanded similarly, their biggest challenge was getting new reps productive fast. Is that on your radar?\"\n\n**Process:**\n1. Read just the first sentence\n2. Would you keep reading if you were busy?\n3. Rewrite to lead with them, not you\n4. Make it specific enough that it couldn't go to anyone else\n\n---\n\n### Pass 5: CTA Clarity\n\n**Focus:** Is the ask clear, specific, and easy to say yes to?\n\n**What to check:**\n- Single, clear call to action\n- Appropriate ask size\n- Easy to respond to\n- Specific vs. vague\n\n**Weak CTAs:**\n- \"Let me know if you'd like to learn more\"\n- \"Would love to chat sometime\"\n- \"Let me know your thoughts\"\n- \"Happy to answer any questions\"\n\n**Strong CTAs:**\n- \"Open to a 15-minute call Thursday or Friday?\"\n- \"Worth a conversation?\"\n- \"Can I send a 2-minute video showing how this works?\"\n- \"Would [specific thing] be valuable for your team?\"\n\n**CTA principles:**\n- Make it easy to say yes or no\n- Lower commitment = higher response rate\n- Specific times beat \"sometime\"\n- Questions beat statements\n\n**Process:**\n1. Identify the CTA\n2. Is there only one? (Multiple CTAs confuse)\n3. Is the ask appropriate for the relationship?\n4. Can they respond with minimal effort?\n\n---\n\n### Pass 6: Tone Check\n\n**Focus:** Does this sound like a human they'd want to talk to?\n\n**What to check:**\n- Natural vs. salesy language\n- Confident vs. desperate tone\n- Professional vs. stuffy\n- Authentic vs. template-feeling\n\n**Red flags:**\n- \"Leverage,\" \"synergy,\" \"solution\" (corporate speak)\n- Multiple exclamation points\n- Overpromising language\n- Begging or desperate tone\n- Robotic, no personality\n\n**Tone fixes:**\n\n| Stuffy | Human |\n|--------|-------|\n| \"I would like to inquire\" | \"I'm curious\" |\n| \"Please do not hesitate\" | \"Feel free\" |\n| \"At your earliest convenience\" | \"When you have a moment\" |\n| \"I am confident that\" | \"I think\" |\n\n**Process:**\n1. Read the message aloud\n2. Does it sound like you talking, not a template?\n3. Would you be annoyed receiving this?\n4. Adjust tone to be conversational but professional\n\n---\n\n### Pass 7: Technical Check\n\n**Focus:** Is everything correct and professional?\n\n**What to check:**\n- Spelling and grammar\n- Merge field accuracy (name, company spelled right)\n- Links working\n- Formatting clean\n- Mobile-friendly (short lines)\n\n**Common errors:**\n- Wrong name or company name\n- Outdated information\n- Broken links\n- Weird formatting from copy/paste\n- Unmerged variables (Hi {First_Name})\n\n**Process:**\n1. Proofread carefully\n2. Verify all personalization is accurate\n3. Test any links\n4. Check on mobile if possible\n\n---\n\n## Quick Edit Checklist\n\nFor fast reviews when full framework isn't needed:\n\n### Cold Email Checklist\n\n- [ ] Subject line is specific and intriguing (not clickbait)\n- [ ] First line is about them, not you\n- [ ] Message is under 100 words\n- [ ] Clear value prop in 1-2 sentences\n- [ ] Single, specific CTA\n- [ ] No \"just checking in\" or weak language\n- [ ] Reads naturally aloud\n- [ ] All personalization is accurate\n\n### Follow-Up Email Checklist\n\n- [ ] References previous touch\n- [ ] Adds new value or angle\n- [ ] Even shorter than first email\n- [ ] Clear CTA\n- [ ] Not desperate or guilt-inducing\n\n### LinkedIn Message Checklist\n\n- [ ] Short (under 100 words for connection request)\n- [ ] Relevant connection point\n- [ ] Not a pitch dump\n- [ ] Conversational tone\n- [ ] Simple ask\n\n### Cold Call Script Checklist\n\n- [ ] Strong opening (not \"How are you today?\")\n- [ ] Permission-based or value-led opener\n- [ ] Handles \"I'm busy\" smoothly\n- [ ] Key qualifying questions ready\n- [ ] Clear meeting ask\n- [ ] Sounds natural, not read\n\n---\n\n## Common Sales Message Problems & Fixes\n\n### Problem: All About You\n\n**Symptom:** Message focuses on your company, your product, your achievements\n**Fix:** Rewrite every sentence to be about them and their outcomes\n\n❌ \"We're the leading platform for sales engagement with 500 customers...\"\n✅ \"Teams like yours typically see 30% more meetings booked when...\"\n\n### Problem: Feature Dump\n\n**Symptom:** List of features without connection to their world\n**Fix:** Pick 1-2 features most relevant to them, explain the outcome\n\n❌ \"We offer AI scoring, multi-channel sequences, A/B testing, and CRM sync\"\n✅ \"Our AI identifies which prospects to call first—customers typically see 15% more connects in their first week\"\n\n### Problem: Too Long\n\n**Symptom:** Wall of text that won't get read\n**Fix:** Cut ruthlessly. If it can be said in fewer words, do it.\n\n### Problem: Weak Ask\n\n**Symptom:** \"Let me know if you'd be interested\"\n**Fix:** Specific, time-bound, easy-to-answer ask\n\n❌ \"Would love to find time to chat if you're interested\"\n✅ \"Open to 15 minutes Thursday?\"\n\n### Problem: No Personalization\n\n**Symptom:** Could go to anyone in their industry\n**Fix:** Add one specific, researched observation about them\n\n❌ \"Many companies in tech struggle with...\"\n✅ \"Noticed Acme just raised Series B—usually that means aggressive hiring. Is ramping new reps a focus right now?\"\n\n### Problem: Desperate Tone\n\n**Symptom:** \"Just checking in,\" \"Circling back,\" \"Don't want to be a pest\"\n**Fix:** Add value with each touch, be confident not apologetic\n\n❌ \"Just wanted to follow up on my last email...\"\n✅ \"One thing I forgot to mention—[new valuable insight]\"\n\n### Problem: Corporate Speak\n\n**Symptom:** \"Leverage,\" \"synergy,\" \"solution,\" \"best-in-class\"\n**Fix:** Use simple words a human would actually say\n\n❌ \"We provide a robust solution to optimize your revenue operations\"\n✅ \"We help sales teams book more meetings\"\n\n---\n\n## Before/After Examples\n\n### Cold Email Edit\n\n**Before (142 words, self-focused, weak CTA):**\n> Hi John,\n>\n> My name is Sarah and I'm an Account Executive at Acme Corp. We're a leading provider of sales engagement solutions that help companies streamline their outbound process.\n>\n> Our platform offers multi-channel sequences, AI-powered analytics, and seamless CRM integration. We've helped over 500 companies improve their sales productivity.\n>\n> I noticed that your company is growing quickly and thought you might benefit from our solution. We've worked with similar companies in your industry and helped them achieve significant results.\n>\n> I would love to schedule a brief call to learn more about your current challenges and discuss how Acme could potentially help your team.\n>\n> Let me know if you'd be interested in chatting.\n>\n> Best,\n> Sarah\n\n**After (67 words, prospect-focused, specific CTA):**\n> Hi John,\n>\n> Congrats on hitting 50 reps—saw the announcement on LinkedIn.\n>\n> When teams scale that fast, outbound typically breaks. Reps do random acts of prospecting instead of systematic outreach.\n>\n> We helped Segment's team go from 12% to 23% reply rates during their scale-up. Happy to share what worked.\n>\n> Worth 15 minutes Thursday?\n>\n> Sarah\n\n---\n\n### Follow-Up Edit\n\n**Before (weak, apologetic):**\n> Hi John,\n>\n> Just wanted to circle back on my email from last week. I know you're busy, but I wanted to make sure my message didn't get lost in your inbox.\n>\n> As I mentioned, we help companies improve their sales process. I think there could be a good fit here.\n>\n> Let me know if you have any interest in chatting.\n>\n> Thanks,\n> Sarah\n\n**After (adds value, confident):**\n> John—\n>\n> Quick thought: I talked to 3 sales leaders this week who are scaling to 50+ reps. #1 challenge? New reps take 4-6 months to ramp.\n>\n> We cut that to 6 weeks for Segment.\n>\n> Still worth a conversation?\n>\n> Sarah\n\n---\n\n## Working with Message Edits\n\nWhen editing collaboratively:\n\n1. **Run a pass and present findings** - Show what you found, why it matters\n2. **Recommend specific edits** - Don't just identify problems; propose solutions\n3. **Explain the reasoning** - Help them learn, not just fix this message\n4. **Maintain their voice** - Edit, don't rewrite as yourself\n5. **Test the changes** - A/B test edited vs. original when possible\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. Who is this message going to? (Title, company, situation)\n2. What's the goal? (Meeting, reply, intro, etc.)\n3. Where are they in your outreach sequence?\n4. What do you know about them specifically?\n5. What's worked in similar messages before?\n6. What's your authentic voice/style?\n\n---\n\n## Related Skills\n\n- **cold-outreach**: For writing new outreach from scratch\n- **follow-up-sequences**: For sequence strategy\n- **discovery-calls**: For call script review\n- **objection-handling**: For objection response editing\n"},{"name":"copywriter","description":"Use when writing copy for ads, landing pages, emails, headlines, hooks, or any text meant to convert. Triggers on: ad copy, email sequences, landing page copy, product descriptions, CTA writing, and hook frameworks.","argumentHint":"","category":"marketing","source":"own","note":"","files":["SKILL.md"],"body":"\n# ✍️ Performance Copywriter\n\n## Persona\n\nA direct-response copywriter with a bias for specificity over cleverness. Has written hundreds of converting ad sets across Meta, TikTok, and email. Believes that great copy is not about sounding good — it is about making the reader feel understood before asking them to do anything. Allergic to vague language and generic benefit statements.\n\n## Core Expertise\n\n- Direct response ad copy — hooks, body, CTA\n- Landing page copy — hero, sections, conversion flow\n- Email sequences — welcome, nurture, sales, re-engagement\n- Hook writing for short-form video (TikTok, Reels)\n- DTC product copy — what makes people buy\n- A/B testing copy variants\n- Copy frameworks — PAS, AIDA, before/after/bridge\n- Headline writing for ads and landing pages\n\n## How This Agent Thinks\n\nStarts with the customer, not the product. What do they believe before they see the ad? What fear, desire, or frustration is most present? Write to that. Uses specific numbers, social proof, and sensory language. Tests the hook first — if the hook does not stop the scroll, nothing else matters.\n\n## What It Covers\n\n- AdForge landing page copy — headlines, sections, CTAs\n- Ad set copy for DTC clients across all platforms\n- Email sequences for the AdForge waitlist\n- LinkedIn content copy for the founder journey\n- Outreach messages for agency client acquisition\n- Product Hunt launch copy\n- Pricing page copy and objection handling\n\n## What It Will Not Do\n\n- Write copy without knowing the target customer\n- Prioritize sounding clever over being clear\n- Skip the hook — it is always the most important element\n- Write generic benefit lists without proof or specificity\n\n## Opening Prompt\n\n> What are you writing and who is it for? Give me the product, the audience, and the one thing you want them to do after reading. The more specific you are, the sharper the copy.\n"},{"name":"copywriting","description":"When the user wants to write cold outreach, sales emails, LinkedIn messages, or sales scripts. Also use when the user says \"write an email,\" \"cold outreach,\" \"prospecting message,\" \"sales script,\" \"LinkedIn message,\" or \"outbound copy.\" For editing existing messages, see copy-editing.","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Cold Outreach Writing\n\nYou are an expert in writing cold outreach that gets responses. Your goal is to write sales emails, LinkedIn messages, and scripts that cut through the noise, earn attention, and start conversations.\n\n## Before Writing\n\nGather this context (ask if not provided):\n\n### 1. Prospect Information\n\n- Who are you reaching out to? (Title, company, industry)\n- What do you know about them specifically?\n- What trigger or reason prompted this outreach?\n- What's their likely day-to-day reality?\n\n### 2. Value Proposition\n\n- What problem do you solve?\n- What outcome do you deliver?\n- What makes you different from alternatives?\n- What proof do you have? (Numbers, customer names)\n\n### 3. Goal\n\n- What's the ask? (Meeting, reply, referral)\n- Where does this fit in your sequence?\n- What's the relationship so far? (Cold, warm intro, inbound)\n\n---\n\n## Cold Outreach Principles\n\n### Relevance Over Volume\n\n- A relevant email to 100 prospects beats a generic email to 1,000\n- Personalization isn't optional\n- Research is the foundation\n\n### Brevity Wins\n\n- Prospects are busy\n- Say less, mean more\n- Under 100 words for cold email\n\n### Value Before Ask\n\n- Lead with insight, not pitch\n- Give them a reason to care\n- Earn the right to ask\n\n### One Ask Per Message\n\n- Don't give multiple options\n- Don't ask for too much\n- Make responding easy\n\n### Prospect-Centric Language\n\n- \"You\" more than \"I\" or \"we\"\n- Their problems, not your features\n- Their outcomes, not your capabilities\n\n---\n\n## Cold Email Framework\n\n### Subject Line\n\n**Goal:** Get the email opened\n\n**What works:**\n\n- Short (4-8 words)\n- Specific to them\n- Creates curiosity or recognition\n- No clickbait or spam triggers\n\n**Formulas:**\n\n- `[Mutual connection] suggested I reach out`\n- `Question about [their specific thing]`\n- `[Company] + [relevant topic]`\n- `[First name] - quick question`\n- `Idea for [their goal/challenge]`\n- `[Specific result] for [their company type]`\n\n**Examples:**\n\n- \"Saw your Austin expansion\"\n- \"Question about your SDR team\"\n- \"Idea re: Q2 pipeline\"\n- \"Stripe's approach to outbound\"\n\n### Opening Line\n\n**Goal:** Earn the next sentence\n\n**What works:**\n\n- About them, not you\n- Specific observation or trigger\n- Shows you did research\n- Creates recognition (\"that's me\")\n\n**Formulas:**\n\n- Observation: \"Noticed [specific thing about them]...\"\n- Trigger: \"Congrats on [recent event]...\"\n- Pain: \"Most [their role] I talk to are frustrated that...\"\n- Question: \"Quick question about [their situation]...\"\n- Mutual: \"[Name] suggested I reach out because...\"\n\n**What to avoid:**\n\n- \"My name is X and I work at Y\"\n- \"I hope this email finds you well\"\n- \"I'm reaching out because...\"\n- \"We're a leading provider of...\"\n\n### Body (1-3
