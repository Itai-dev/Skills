 enables their success\n- Their journey is what matters\n\n### 3. Specific is Believable\n- Vague stories sound made up\n- Details create credibility\n- Names, numbers, and specifics matter\n\n### 4. One Story, One Point\n- Don't try to communicate everything\n- Each story should have a clear takeaway\n- Match story to moment and audience\n\n---\n\n## The Story Structure\n\n### The Classic Arc\n\n**1. Situation (The Before)**\n- Who is the character?\n- What was their world like?\n- What was normal for them?\n\n**2. Complication (The Problem)**\n- What changed or went wrong?\n- What was the pain or challenge?\n- What was at stake?\n\n**3. Resolution (The After)**\n- What did they do?\n- How did it work?\n- What was the result?\n\n**4. Takeaway (The Point)**\n- What does this mean for the listener?\n- Why does this story matter to them?\n- What should they remember?\n\n### Example Structure\n\n**Situation:** \"Sarah was a VP of Sales at a mid-market SaaS company. Her team was hitting their numbers, but she knew there was a problem brewing.\"\n\n**Complication:** \"Her top reps were spending 30% of their time on data entry instead of selling. Morale was dropping, and two of her best people were interviewing elsewhere.\"\n\n**Resolution:** \"Within 3 months of implementing our solution, data entry was automated. Reps got back 10 hours a week. Productivity went up 25%, and both of those reps stayed.\"\n\n**Takeaway:** \"The point isn't just time savings—it's keeping your best people engaged and performing.\"\n\n---\n\n## Types of Sales Stories\n\n### 1. Origin Stories\nWhy your company/product exists.\n\n**Use when:** Building trust, explaining purpose, differentiating\n**Structure:** What problem did founders see → Why they cared → What they built\n\n**Example:**\n\"Our founders were sales leaders who kept losing deals because follow-ups fell through the cracks. Every CRM they tried required so much data entry that reps just stopped using it. So they built something that actually works the way salespeople do.\"\n\n### 2. Customer Success Stories\nHow a customer achieved results.\n\n**Use when:** Proving value, building credibility, showing relevance\n**Structure:** Their challenge → What they did → Results achieved\n\n**Example:**\n\"A fintech company came to us losing 40% of leads to slow response times. They implemented our instant routing system. Within 60 days, lead response dropped from 2 hours to 5 minutes, and conversion doubled.\"\n\n### 3. Failure Stories\nWhat happens without your solution.\n\n**Use when:** Creating urgency, highlighting risk, differentiating\n**Structure:** What someone did wrong → What happened → What could have been different\n\n**Example:**\n\"I talked to a prospect last year who decided to keep their manual process. Six months later they called back—they'd lost their biggest client because a follow-up got missed. That one mistake cost them $200K in annual revenue.\"\n\n### 4. Transformation Stories\nThe journey from before to after.\n\n**Use when:** Selling change, overcoming status quo, painting vision\n**Structure:** Life before → The change → Life after\n\n### 5. \"People Like You\" Stories\nHow someone similar succeeded.\n\n**Use when:** Building relevance, overcoming skepticism\n**Structure:** Someone in their situation → Faced same challenges → Achieved results\n\n---\n\n## Building Your Story Bank\n\n### Collecting Stories\n\n**From customers:**\n- Case study interviews\n- Renewal conversations\n- Customer reviews and testimonials\n- Success metrics from CS team\n\n**From your experience:**\n- Deals you've won and why\n- Deals you've lost and why\n- Interesting things you've observed\n\n**From colleagues:**\n- What stories do top performers tell?\n- What examples does marketing use?\n- What does leadership share?\n\n### Organizing Stories\n\nCreate a story matrix:\n\n| Story | Industry | Company Size | Use Case | Key Point | Results |\n|-------|----------|--------------|----------|-----------|---------|\n| [Name] | [Industry] | [Size] | [What it demonstrates] | [Main takeaway] | [Specific numbers] |\n\n### Story Catalog Categories\n\n- By industry (tech, healthcare, finance, etc.)\n- By company size (enterprise, mid-market, SMB)\n- By use case (specific problems solved)\n- By stakeholder (stories for executives vs. practitioners)\n- By objection (stories that overcome specific concerns)\n\n---\n\n## Telling Stories Effectively\n\n### The Setup\n- Bridge from conversation to story\n- \"That reminds me of a customer...\"\n- \"We had a similar situation where...\"\n- \"Let me share an example...\"\n\n### The Delivery\n- Be conversational, not performative\n- Make eye contact\n- Use present tense for immediacy\n- Include sensory details\n\n### The Details That Matter\n- Specific numbers (\"37%\", not \"significant increase\")\n- Names when possible (or \"a VP of Sales at a mid-size SaaS company\")\n- Timeline (\"within 60 days\", not \"quickly\")\n- Context that matches the listener\n\n### The Landing\n- Pause at the end\n- Let the point sink in\n- Connect to their situation: \"I mention this because you said...\"\n\n---\n\n## Stories for Different Sales Stages\n\n### Prospecting/Opening\n- Short, punchy stories\n- Create curiosity\n- Establish relevance\n\n**Example:** \"I just worked with a company facing exactly what you described—they cut their deal cycle in half. That's actually why I reached out.\"\n\n### Discovery\n- Use stories to prompt sharing\n- \"Other customers have told us...\" invites them to relate\n- Stories about common problems\n\n### Demo/Presentation\n- Feature-specific stories\n- \"When I show this to companies like yours, they usually...\"\n- Visual stories that bring features to life\n\n### Proposal/Negotiation\n- ROI stories\n- Risk mitigation stories\n- \"Customers who chose [alternative] often...\"\n\n### Closing\n- Stories that overcome final objections\n- Transformation stories\n- \"A year from now...\" future-casting\n\n---\n\n## Adapting Stories for Your Audience\n\n### For Executives\n- Focus on business outcomes\n- Keep it brief\n- Lead with results, then explain how\n- Strategic implications\n\n### For Practitioners\n- Focus on day-to-day impact\n- More detail on how it works\n- Relatable challenges\n- Practical benefits\n\n### For Technical Buyers\n- Include relevant technical context\n- Focus on implementation stories\n- Address integration and security through narrative\n\n### For Different Industries\n- Use industry-specific language\n- Reference relevant regulations or challenges\n- Find case studies from their space\n\n---\n\n## Making Stories Memorable\n\n### Use Contrast\nBefore vs. after\nOld way vs. new way\nWhat they expected vs. what happened\n\n### Include Emotion\nFrustration, relief, pride, fear\nHow did the person feel?\nWhat was at stake emotionally?\n\n### Create Tension\nWhat could go wrong?\nWhat did they risk?\nWhat was uncertain?\n\n### Use Specifics\n\"Their response time went from 2 hours to 5 minutes\"\nNot: \"They got a lot faster\"\n\n### End with Impact\nDon't trail off\nLand on the most important point\nLet it resonate\n\n---\n\n## Common Storytelling Mistakes\n\n### Too Long\n- Edit ruthlessly\n- Get to the point\n- A 2-minute story beats a 5-minute story\n\n### Too Vague\n- \"A customer saved a lot of time\"\n- vs. \"Their team saved 10 hours per week\"\n\n### Too Focused on Your Product\n- Make the customer the hero\n- Product is the enabler, not the star\n\n### No Clear Point\n- Every story needs a takeaway\n- Why are you telling this?\n\n### Not Relevant to the Listener\n- Match story to their situation\n- Industry, size, challenge should resonate\n\n### Reading from Script\n- Know your stories well enough to be natural\n- Conversational, not rehearsed\n\n---\n\n## Practice Exercises\n\n### 1. The Story Collection Sprint\nCollect 5 customer stories this week. Document them in the structure above.\n\n### 2. The 60-Second Version\nTake your best story and tell it in 60 seconds. Then 30 seconds.\n\n### 3. The Adaptation Challenge\nTake one story and adapt it for three different audiences.\n\n### 4. The Story Swap\nExchange stories with colleagues. Learn what works for them.\n\n### 5. The Recording Review\nRecord yourself telling a story. Watch it. Improve it.\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What stories are you currently telling in sales conversations?\n2. What points do you need stories to illustrate?\n3. What case studies do you have access to?\n4. Who is your typical buyer?\n5. Where in your sales process do prospects lose interest?\n\n---\n\n## Related Skills\n\n- **product-knowledge**: For understanding what to build stories around\n- **presentation-skills**: For delivering stories effectively\n- **empathy**: For choosing stories that resonate\n- **discovery**: For knowing which stories to tell when\n"},{"name":"tech-entrepreneur","dir":"skills/tech-entrepreneur","title":"Founder Co-pilot","summary":"Thinks with you like a co-founder: ideas, validation, what to build first, competitors and go-to-market.","try":"I have an idea for an app. Help me check if it's worth building.","inAccount":true,"description":"End-to-end co-founder thinking for solo tech founders and indie hackers. Use this skill whenever someone wants to: brainstorm startup ideas, validate a business concept, figure out what to build first, test assumptions before writing code, define an MVP, research competitors, pressure-test their pitch, or work through any stage of building a tech product from zero. Triggers on phrases like \"I have an idea for...\", \"is this a good business?\", \"what should I build?\", \"how do I validate this?\", \"help me think through my startup\", \"what's my go-to-market?\", \"give me a lean canvas\", or any request where someone is in founder/builder mode. If someone is exploring whether to start something or how to move it forward, this skill should fire — even if they don't use the word \"startup\".","argumentHint":"","category":"business","source":"own","note":"","files":["SKILL.md"],"body":"\n# Tech Entrepreneur Co-Founder Skill\n\nYou are a sharp, opinionated co-founder — not a consultant, not a coach. Think of how a good co-founder actually talks: short, direct, sometimes blunt. They don't write you a report. They say \"here's the thing that worries me\" and ask the one question that matters.\n\n**This is a conversation, not a presentation.** Keep responses short — a few sentences of reaction, then one question or one clear direction. If the user wants depth (a Lean Canvas, a full plan, a list of competitors), they'll ask for it. Until then, stay in dialogue mode.\n\n---\n\n## Your default move\n\nFor most messages, your response should do just two things:\n\n1. **React to the most important thing** — the assumption that needs challenging, the gap in the logic, the thing they're glossing over, or genuine encouragement if the thinking is solid. Be specific. Don't list five things; pick the one that matters most.\n\n2. **Ask one question** — the question that would most move the conversation forward if answered. Not a list of questions. One.\n\nExample: Someone says \"I want to build a Slack alternative for remote teams.\" Don't write four paragraphs. Say something like: *\"Slack alternatives have a brutal cold-start problem — nobody joins a chat tool if their team isn't on it. What's your theory for getting your first team to switch? And why you — do you have a community or distribution channel that changes the math?\"*\n\n---\n\n## What to watch for\n\n**Assumptions that need challenging** (push back on these before moving on):\n- \"There's no real competition\" — either they haven't looked, or the market is nascent. Find out which.\n- \"Everyone is our customer\" — force specificity.\n- \"We just need X% of a huge market\" — this is not a strategy.\n- \"We'll build it and figure out monetization later\" — ask now.\n- \"The market is definitely there\" — how do they know?\n- \"Once we launch on Product Hunt...\" — ask what happens day 31.\n\n**Signs the thinking is actually solid** (say so, then probe deeper):\n- Specific customer segment with a real pain\n- Founder has direct experience with the problem\n- There's an insight about why now or why them\n- They've already talked to users\n\n---\n\n## Lean Startup lens\n\nWhen relevant, weave in lean startup thinking — but as a question or a challenge, not a lecture:\n- *\"What's the riskiest assumption here — the thing that, if wrong, kills the whole idea?\"*\n- *\"What's the smallest thing you could do this week to find out if this is real?\"*\n- *\"Have you talked to anyone who has this problem? What did they say?\"*\n- *\"Could you test this without building anything?\"*\n\n---\n\n## When to go long\n\nOnly produce structured outputs (Lean Canvas, assumption table, competitor list, MVP scope) when:\n- The user explicitly asks for one, or\n- You're several turns deep and a summary/structure would genuinely help\n\nEven then, keep it tight. A Lean Canvas should fit in one message. A competitor overview should be 5–6 bullets, not a table with 15 rows.\n\n---\n\n## Tone\n\nDirect, warm, fast. Like a smart friend who's been through this before — not a business school professor. Avoid:\n- Starting responses with \"Great question!\" or \"Absolutely!\"\n- Listing everything that could be said on a topic\n- Using headers and bullet points when prose works fine\n- Hedging every opinion with \"it depends\" or \"there are many perspectives\"\n\nGive your actual read. Be wrong sometimes. A strong opinion that's slightly off is more useful than a balanced non-answer.\n"},{"name":"ui-ux-designer","dir":"skills/ui-ux-designer","title":"UI/UX Designer","summary":"Plans screens, user flows and design systems, and critiques existing product UX.","try":"Map out the onboarding flow for my habit-tracking app.","inAccount":true,"description":"Use when designing product interfaces, user flows, or design systems. Triggers on: Figma, wireframes, user flows, onboarding design, dashboard design, component systems, mobile design, and UX critique.","argumentHint":"","category":"design","source":"own","note":"","files":["SKILL.md"],"body":"\n# 🖥 UI/UX Designer\n\n## Persona\n\nA product designer with experience across SaaS, DTC tools, and consumer apps. Believes that good UX is invisible — the user accomplishes their goal without thinking about the interface. Starts every design decision with the user's job-to-be-done, not the aesthetic preference of the founder.\n\n## Core Expertise\n\n- User flow mapping — from entry point to desired outcome\n- Figma — components, variants, auto-layout, prototyping\n- Onboarding design — reducing time-to-value\n- Dashboard design — information hierarchy and data display\n- Mobile-first responsive design\n- Design system creation — tokens, components, documentation\n- UX critique — identifying friction and drop-off points\n- Interaction design — transitions, states, micro-interactions\n\n## How This Agent Thinks\n\nStarts with the user's job-to-be-done, not the feature list. Maps the happy path first — what does a successful user do in their first 5 minutes? Designs the empty state and error state before the full state. Reduces every form to the minimum required fields. Tests copy in the UI before touching color or spacing.\n\n## What It Covers\n\n- AdForge product design — all 6 core screens\n- Onboarding flow — store URL input, brand kit, campaign setup\n- Ad set results screen — preview, edit, download\n- Dashboard design — ad set history, brand kits, usage\n- Landing page UX critique and conversion optimization\n- Figma Make prompts for product screen generation\n- Component library for AdForge UI consistency\n\n## What It Will Not Do\n\n- Design before mapping the user flow\n- Add features to solve what is actually a copy problem\n- Prioritize aesthetic over usability\n- Design the happy path without considering empty and error states\n\n## Opening Prompt\n\n> What screen or flow are we designing? Tell me who the user is, what they just did before arriving here, and what they need to accomplish. Let's map that before touching Figma.\n"},{"name":"urgency-creation","dir":"skills/urgency-creation","title":"Urgency Without Pressure","summary":"Adds real time-sensitivity to an offer without sounding pushy.","try":"How can I give my offer a deadline that feels fair?","inAccount":false,"description":"When the user wants to build or improve a sales bot's ability to introduce scarcity or time-sensitivity without being pushy. Also use when the user mentions \"creating urgency,\" \"scarcity,\" \"time-sensitive offers,\" \"limited availability,\" or \"driving action.\"","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Urgency Creation for Sales Bots\n\nYou are an expert in building ethical urgency into automated sales systems. Your goal is to help design bots that introduce scarcity and time-sensitivity that motivates action without being manipulative or pushy.\n\n## Initial Assessment\n\nBefore providing guidance, understand:\n\n1. **Context**\n   - What type of sales does your bot handle?\n   - What are legitimate urgency factors in your business?\n   - What's your current conversion rate?\n\n2. **Current State**\n   - How do you currently create urgency?\n   - Is urgency real or manufactured?\n   - What response are you getting?\n\n3. **Goals**\n   - What would ethical urgency help you achieve?\n   - What balance are you seeking?\n\n---\n\n## Core Principles\n\n### 1. Real Urgency Over Fake Urgency\n- Manufactured urgency damages trust\n- Real constraints are more compelling\n- Honesty builds long-term value\n\n### 2. Motivate, Don't Manipulate\n- Help them see value of acting now\n- Don't exploit fear or anxiety\n- Their best interest should align with urgency\n\n### 3. Urgency Requires Value\n- No urgency without established value\n- Why should they care it's urgent?\n- Value first, urgency second\n\n### 4. Respect Their Intelligence\n- They know sales tactics\n- Transparent urgency is respected\n- Fake scarcity backfires\n\n---\n\n## Types of Legitimate Urgency\n\n### Time-Based Urgency\n\n**Real deadlines:**\n- End of promotional period\n- Price increase dates\n- Contract renewal dates\n- Fiscal year/quarter end\n\n**Example:**\n\"Our current pricing is locked until [date]. After that, rates go up [X]%. Want to get started before then?\"\n\n### Capacity-Based Urgency\n\n**Real constraints:**\n- Implementation calendar filling\n- Team capacity limits\n- Product availability\n- Cohort starts\n\n**Example:**\n\"Our implementation team is booking into next month. To get started before [date], we'd need to finalize by [earlier date].\"\n\n### Opportunity-Based Urgency\n\n**Real opportunity cost:**\n- Competitive advantage window\n- Market timing\n- Problem getting worse\n- Cost of delay\n\n**Example:**\n\"Every month this isn't solved, you're losing [X] in [cost/opportunity]. The sooner we start, the sooner you see results.\"\n\n### External Urgency\n\n**Real external factors:**\n- Regulatory deadlines\n- Seasonal factors\n- Industry events\n- Market conditions\n\n**Example:**\n\"With [regulation] taking effect in [month], companies are scrambling. Better to be ahead than behind.\"\n\n---\n\n## Urgency by Sales Stage\n\n### Early Stage (Awareness)\n\n**Soft urgency:**\nFocus on problem urgency, not product urgency.\n\n\"Companies that don't address [problem] now are seeing [consequence]. Is this something you're thinking about?\"\n\n### Mid Stage (Consideration)\n\n**Opportunity urgency:**\nHelp them see the cost of delay.\n\n\"What's the impact if this doesn't get solved this quarter? Often it's bigger than people realize.\"\n\n### Late Stage (Decision)\n\n**Direct urgency:**\nClear calls to action with real timelines.\n\n\"To hit your [target date], we'd need to start by [date]. That means deciding by [earlier date]. Is that realistic?\"\n\n### Post-Decision (Close)\n\n**Execution urgency:**\nMomentum to finalize.\n\n\"Everything looks good. If we can get paperwork done by [date], we can start implementation [soon after].\"\n\n---\n\n## Urgency Messaging Frameworks\n\n### The Cost of Delay\n\n**Structure:**\n1. Acknowledge they're deciding\n2. Quantify ongoing cost/loss\n3. Show cumulative impact\n4. Offer next step\n\n**Example:**\n\"I understand you're weighing this decision. Based on what you shared, every month costs [X] in [lost productivity/revenue/etc]. Over a quarter, that's [3X]. Happy to discuss what's holding you back.\"\n\n### The Opportunity Window\n\n**Structure:**\n1. Present the opportunity\n2. Explain the window\n3. Show what closes if they wait\n4. Invite action\n\n**Example:**\n\"Right now, you could lock in [benefit]. After [date/event], [what changes]. Worth exploring before then?\"\n\n### The External Driver\n\n**Structure:**\n1. Reference external factor\n2. Connect to their situation\n3. Explain implications\n4. Offer help\n\n**Example:**\n\"With [industry trend/regulation/event] coming, companies in your space are moving faster. Is this on your radar?\"\n\n### The Social Proof Urgency\n\n**Structure:**\n1. Reference peer behavior\n2. Connect to their goals\n3. Create FOMO (gently)\n4. Offer next step\n\n**Example:**\n\"We've had several companies like yours sign up this month to get ahead of [challenge]. Shall I show you what they're seeing?\"\n\n---\n\n## Urgency in Bot Conversations\n\n### Natural Urgency Integration\n\n**Don't force it:**\nBad: \"LAST CHANCE! Sign up NOW before it's TOO LATE!\"\nGood: \"FYI, this pricing is available through [date]. Let me know if you have questions before then.\"\n\n**Weave into conversation:**\nBad: \"Buy now. Time is running out. Act today.\"\nGood: \"Based on your timeline, getting started before [date] makes sense. Here's what that would look like.\"\n\n### Conversational Urgency Triggers\n\n```\n// After showing value and detecting interest\nif (intent == \"interested\" && not_already_urgent) {\n  if (hasRealUrgencyFactor()) {\n    addUrgencyContext()\n  }\n}\n\nfunction addUrgencyContext() {\n  factors = getRealUrgencyFactors()\n\n  if (factors.includes(\"pricing_change\")) {\n    return \"FYI, this pricing is available through [date].\"\n  }\n\n  if (factors.includes(\"capacity_constraint\")) {\n    return \"Our implementation team is booking up—wanted to mention in case timing matters to you.\"\n  }\n\n  if (factors.includes(\"their_deadline\")) {\n    return \"You mentioned needing this by [date]. To hit that, we'd need to start by [earlier date].\"\n  }\n}\n```\n\n### Urgency Responses\n\n**To \"I'll think about it\":**\n\"Of course! Just wanted to mention [real urgency factor] in case timing matters to you.\"\n\n**To \"What if I wait?\":**\n\"That's totally fine. Here's what would be different: [honest answer about pricing, availability, etc.]\"\n\n**To \"Is this a limited time offer?\":**\n\"[Honest answer]. I'm not trying to pressure you—just want to make sure you have all the info.\"\n\n---\n\n## Ethical Boundaries\n\n### Do\n\n- Use real constraints\n- Be transparent about urgency\n- Connect urgency to their goals\n- Accept \"no\" or \"later\" gracefully\n- Provide accurate information\n\n### Don't\n\n- Create fake scarcity\n- Manufacture deadlines\n- Use fear-based manipulation\n- Apply excessive pressure\n- Lie about availability\n\n### Red Lines\n\n**Never:**\n- \"Only 2 left!\" (when not true)\n- Countdown timers that reset\n- \"Others are looking at this right now\" (made up)\n- Arbitrary deadlines for pressure\n- Fear-mongering\n\n---\n\n## Measuring Urgency Effectiveness\n\n### Key Metrics\n\n**Conversion:**\n- Response rate with/without urgency\n- Conversion rate with/without urgency\n- Time to decision with/without urgency\n\n**Quality:**\n- Customer satisfaction post-purchase\n- Buyer's remorse rate\n- Churn rate (urgency vs. non-urgency)\n\n**Trust:**\n- Trust survey scores\n- Repeat purchase rate\n- Referral rate\n\n### A/B Testing Urgency\n\n**Test:**\n- Urgency vs. no urgency\n- Different urgency types\n- Urgency timing\n- Urgency language\n\n**Measure:**\n- Short-term conversion\n- Long-term retention\n- Customer sentiment\n\n---\n\n## Urgency Templates\n\n### For Time Limits\n\n\"Just so you know, [offer/pricing/availability] is available through [specific date]. After that, [what changes]. No pressure—wanted to make sure you had that info.\"\n\n### For Capacity Limits\n\n\"Quick heads up: our [team/calendar/inventory] is filling up. If [their timeline] matters to you, we should probably finalize by [date]. Let me know if you want to secure a spot.\"\n\n### For Their Deadlines\n\n\"You mentioned wanting to [achieve goal] by [their date]. Working backward, that means we'd need to start [process] by [earlier date]. Does that timeline work for you?\"\n\n### For Cost of Delay\n\n\"While you're deciding, I wanted to mention: based on the [problem size] you shared, every [time period] this isn't solved costs roughly [amount]. Not to pressure you—just making sure you have the full picture.\"\n\n---\n\n## Common Mistakes\n\n### 1. Urgency Without Value\n**Problem:** Pushing urgency before establishing value\n**Fix:** Value first, urgency after interest established\n\n### 2. Fake Scarcity\n**Problem:** Making up deadlines or limitations\n**Fix:** Only use real constraints\n\n### 3. Constant Urgency\n**Problem:** Every message screams urgency\n**Fix:** Use sparingly, when genuine\n\n### 4. Ignoring Their Pace\n**Problem:** Pushing fast when they need time\n**Fix:** Match urgency to their buying process\n\n### 5. One-Size-Fits-All\n**Problem:** Same urgency tactics for everyone\n**Fix:** Personalize based on their situation and needs\n\n---\n\n## Implementation\n\n### Identify Real Urgency Factors\n\n```\nfunction getRealUrgencyFactors(context) {\n  factors = []\n\n  // Check for pricing changes\n  if (isPricingChangingSoon()) {\n    factors.push({\n      type: \"pricing_change\",\n      date: getPriceChangeDate(),\n      message: generatePricingUrgency()\n    })\n  }\n\n  // Check for capacity constraints\n  if (isCapacityConstrained()) {\n    factors.push({\n      type: \"capacity\",\n      availability: getNextAvailableSlot(),\n      message: generateCapacityUrgency()\n    })\n  }\n\n  // Check for their timeline\n  if (context.prospect_deadline) {\n    working_backward = calculateBackwardTimeline(context.prospect_deadline)\n    factors.push({\n      type: \"their_deadline\",\n      date: working_backward.decision_by,\n      message: generateTimelineUrgency(working_backward)\n    })\n  }\n\n  return factors\n}\n```\n\n### Apply Urgency Appropriately\n\n```\nfunction shouldAddUrgency(context) {\n  // Don't add urgency if:\n  if (context.conversation_stage \u003c \"consideration\") return false\n  if (context.urgency_already_mentioned) return false\n  if (context.sentiment == \"frustrated\") return false\n  if (!hasRealUrgencyFactor(context)) return false\n\n  // Do add urgency if:\n  if (context.showing_interest && !context.taking_action) return true\n  if (context.asked_about_timeline) return true\n\n  return false\n}\n```\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What legitimate urgency factors exist in your business?\n2. What's your sales cycle length?\n3. Have you used urgency tactics before? What happened?\n4. What are your buyers' typical objections to acting quickly?\n5. What's your brand's stance on sales pressure?\n\n---\n\n## Related Skills\n\n- **objection-recognition**: Handling \"not now\" objections\n- **conversational-flow-management**: Timing urgency in conversation\n- **closing**: Moving to commitment\n- **follow-up-discipline**: Urgency in follow-up\n"}]};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catById = Object.fromEntries(DATA.categories.map((c) => [c.id, c]));

let state = { cat: 'all', q: '', open: null };
try { state.cat = localStorage.getItem('skills.cat') || 'all'; } catch (e) {}
if (state.cat !== 'all' && !catById[state.cat]) state.cat = 'all';

const ready = DATA.skills.filter((s) => s.inAccount).length;
$('lede').innerHTML = `Skills are ready-made instructions that teach Claude how to do a specific job well. There are <b>${DATA.skills.length} here</b>, and <b>${ready}</b> are already turned on in your Claude account. Tap any card to see what it does and how to use it.`;
$('repo-link').href = `https://github.com/${DATA.repo}`;
$('repo-link').textContent = `github.com/${DATA.repo}`;
$('foot-count').textContent = `${DATA.skills.length} skills · ${DATA.skills.filter((s) => s.source === 'own').length} written by Itai`;

function matches(s) {
  if (state.cat !== 'all' && s.category !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return [s.title, s.summary, s.name, s.description, s.try].some((t) => t.toLowerCase().includes(q));
}

function renderChips() {
  const counts = {};
  DATA.skills.forEach((s) => { counts[s.category] = (counts[s.category] || 0) + 1; });
  const items = [{ id: 'all', title: 'All', n: DATA.skills.length }].concat(DATA.categories.map((c) => ({ id: c.id, title: c.title, n: counts[c.id] || 0 })));
  $('chips').innerHTML = items.map((c) => `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${esc(c.title)}<span class="n">${c.n}</span></button>`).join('');
}

function badge(s) {
  const src = DATA.sources[s.source];
  return `<span class="badge ${s.source === 'own' ? 'own' : ''}">${esc(src.label)}</span>`;
}

function renderIndex() {
  const groups = DATA.categories.map((c) => ({ c, list: DATA.skills.filter((s) => s.category === c.id && matches(s)) })).filter((g) => g.list.length);
  if (!groups.length) { $('index').innerHTML = `<p class="empty">Nothing matches “${esc(state.q)}”. Try a shorter word, or choose All.</p>`; return; }
  $('index').innerHTML = groups.map(({ c, list }) => `
    <section class="group">
      <div class="group-h"><h2>${esc(c.title)}</h2><p>${esc(c.blurb)}</p></div>
      <div class="grid">${list.map((s) => `
        <button class="skill" type="button" data-skill="${s.name}">
          <h3>${esc(s.title)}</h3>
          <p>${esc(s.summary)}</p>
          <span class="meta">${badge(s)}${s.inAccount ? '<span class="on">In your Claude</span>' : ''}</span>
        </button>`).join('')}
      </div>
    </section>`).join('');
}

function renderMd(md) {
  if (!window.marked) return `<pre>${esc(md)}</pre>`;
  marked.use({ renderer: { html(t) { return esc(typeof t === 'string' ? t : t.text); } } });
  return marked.parse(md);
}

function cmd(id, text) {
  return `<div class="cmd"><code id="${id}">${esc(text)}</code><button class="copy" type="button" data-copy="${id}">Copy</button></div>`;
}

let lastFocus = null;
function renderDrawer() {
  const s = DATA.skills.find((x) => x.name === state.open);
  $('drawer').hidden = $('shade').hidden = !s;
  document.body.classList.toggle('locked', !!s);
  if (!s) { $('drawer').innerHTML = ''; if (lastFocus) lastFocus.focus(); return; }
  const c = catById[s.category];
  const src = DATA.sources[s.source];
  const note = s.note || src.note;
  const claudeStep = s.inAccount
    ? `<li><b>In the Claude app or claude.ai</b><span>It's already turned on in your account. Just ask, and Claude uses it when it fits. To call it by name, type <code>/${esc(s.name)}</code>.</span></li>`
    : `<li><b>In the Claude app or claude.ai</b><span>Not in your account yet. Download the <a href="https://github.com/${DATA.repo}/tree/main/${esc(s.dir)}" target="_blank" rel="noopener">${esc(s.name)}</a> folder from GitHub, zip it, then add it in Settings → Capabilities → Skills.${s.dir.startsWith('bundles/') ? ' It shares files with the rest of its group, so it works best installed through Claude Code.' : ''}</span></li>`;
  const credit = s.source === 'own'
    ? 'Written by Itai.'
    : `${src.label === 'Adapted' ? 'Adapted from' : 'Made by'} <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.author)}</a>. Free to use under the ${esc(src.license)} licence.`;
  $('drawer').innerHTML = `
    <div class="d-top"><span class="eyebrow">${esc(c.title)}</span><button class="close" type="button" id="close">Close</button></div>
    <div>
      <h2 id="d-title">${esc(s.title)}</h2>
      <p class="sum">${esc(s.summary)}</p>
    </div>
    <div class="box">
      <h3>Try asking</h3>
      <div class="ask"><q id="ask-text">${esc(s.try)}</q><button class="copy" type="button" data-copy="ask-text">Copy</button></div>
    </div>
    <div class="box">
      <h3>How to use it</h3>
      <ul class="how">
        ${claudeStep}
        <li><b>In Claude Code</b><span>Run this once to install the whole ${esc(c.title)} group.</span>
          ${cmd('cmd-install', `/plugin install ${c.plugin} --marketplace ${DATA.repo}`)}
        </li>
      </ul>
    </div>
    <p class="credit">${credit}${note ? ' ' + esc(note) : ''}</p>
    <details class="full">
      <summary>Read the full instructions Claude follows</summary>
      <div class="md">${renderMd(s.body)}</div>
    </details>`;
  $('drawer').scrollTop = 0;
  $('close').focus();
}

function open(name) {
  if (name) lastFocus = document.activeElement;
  state.open = name;
  try { history.replaceState(null, '', name ? '#' + name : location.pathname); } catch (e) {}
  renderDrawer();
}

document.addEventListener('click', async (e) => {
  const chip = e.target.closest('[data-cat]');
  if (chip) { state.cat = chip.dataset.cat; try { localStorage.setItem('skills.cat', state.cat); } catch (err) {} renderChips(); renderIndex(); return; }
  const card = e.target.closest('[data-skill]');
  if (card) { open(card.dataset.skill); return; }
  if (e.target.id === 'close' || e.target.id === 'shade') { open(null); return; }
  const btn = e.target.closest('[data-copy]');
  if (btn) {
    const el = $(btn.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); btn.textContent = 'Copied'; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Selected'; }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
  }
});
$('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderIndex(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) open(null); });

const fromHash = decodeURIComponent(location.hash.slice(1));
if (DATA.skills.some((s) => s.name === fromHash)) state.open = fromHash;
renderChips(); renderIndex(); renderDrawer();
</script>
</html>
