\n\nOverthinking prevents action. The need for more information becomes a way to avoid deciding.\n\n**Sales application**: Recognize when prospects are stuck in analysis mode. Help them set decision criteria and a timeline. \"What information would you need to make a confident decision?\"\n\n---\n\n## Influence & Persuasion Principles\n\nThese models help you ethically influence buyer decisions.\n\n### Reciprocity Principle\n\nPeople feel obligated to return favors. Give first, and people want to give back.\n\n**Sales application**: Provide value before asking for anything. Free assessments, valuable insights, helpful introductions—all create reciprocal obligation.\n\n### Commitment & Consistency\n\nOnce people commit to something, they want to stay consistent with that commitment.\n\n**Sales application**: Get small commitments first. Agreement on the problem, acknowledgment of impact, acceptance of a meeting—each small yes makes the next yes easier.\n\n### Authority Bias\n\nPeople defer to experts and authority figures. Credentials and expertise create trust.\n\n**Sales application**: Establish expertise early. Share relevant experience, industry knowledge, and credentials. \"I've worked with 50 companies in your industry on this exact challenge...\"\n\n### Liking / Similarity Bias\n\nPeople say yes to those they like and those similar to themselves.\n\n**Sales application**: Find genuine common ground. Shared backgrounds, mutual connections, similar experiences all build rapport. People buy from people they like.\n\n### Social Proof\n\nPeople look to others' behavior to determine their own. Popularity signals quality and safety.\n\n**Sales application**: Reference customers, testimonials, case studies, and numbers. \"We work with [customers] including several in your space...\" validates the decision.\n\n### Scarcity / Urgency\n\nLimited availability increases perceived value. Scarcity signals desirability.\n\n**Sales application**: Create genuine urgency with real deadlines, limited capacity, or business cost of waiting. Never manufacture fake scarcity—it destroys trust.\n\n### Unity Principle\n\nShared identity drives influence. \"One of us\" is powerful.\n\n**Sales application**: Position yourself as part of their tribe. \"As someone who's been in [their role]...\" or \"We built this because we faced the same problem...\"\n\n### Foot-in-the-Door Technique\n\nStart with a small request, then escalate. Compliance with small requests leads to compliance with larger ones.\n\n**Sales application**: Discovery call → Demo → Pilot → Purchase. Each step builds on the last. Don't ask for the big commitment first.\n\n### Door-in-the-Face Technique\n\nStart with a larger request, then retreat to what you actually want. The contrast makes the second request seem reasonable.\n\n**Sales application**: Present the full enterprise solution first, then offer the starter package. The contrast makes the smaller commitment feel easier.\n\n### Contrast Effect\n\nThings seem different depending on what they're compared to.\n\n**Sales application**: Show the \"before\" state clearly. Present the full price before the discount. Show the competitor's complexity before your simplicity.\n\n---\n\n## Pricing & Value Psychology\n\nThese models specifically address how buyers perceive price and value.\n\n### Anchoring Effect\n\nThe first number people see heavily influences subsequent judgments.\n\n**Sales application**: Anchor high. Share ROI numbers first, then price. Show enterprise pricing before the tier you're selling. \"Companies typically see $500K in savings. The investment is $50K.\"\n\n### Price-Value Relationship\n\nPrice signals quality. Higher prices can increase perceived value.\n\n**Sales application**: Don't lead with being cheap. If your price is lower, frame it as efficiency, not inferior quality. Premium pricing can actually increase win rates.\n\n### Decoy Effect\n\nAdding a third, inferior option makes one of the original two look better.\n\n**Sales application**: A \"decoy\" tier that's clearly worse value makes your preferred tier look like the obvious choice.\n\n### Framing Effect\n\nHow something is presented changes how it's perceived. Same facts, different frames.\n\n**Sales application**: \"$3/day\" vs. \"$90/month\" vs. \"$1,000/year\"—same price, different perceptions. Frame based on what makes the value clearest.\n\n### Mental Accounting\n\nPeople treat money differently based on its source or intended use, even though money is fungible.\n\n**Sales application**: Help buyers put your product in the right mental account. \"This comes out of your [budget category]\" or \"Compare it to what you spend on [related expense].\"\n\n### Zero-Price Effect\n\nFree isn't just a low price—it's psychologically different. \"Free\" triggers irrational preference.\n\n**Sales application**: Free trials, free pilots, and free assessments have disproportionate appeal. The jump from $1 to $0 is bigger than from $2 to $1.\n\n### Pain of Paying\n\nPaying activates the same brain regions as physical pain. More visible payment = more pain.\n\n**Sales application**: Annual billing (one payment) is less painful than monthly (12 payments). Automatic payments are less painful than manual ones.\n\n### Reference Points\n\nPeople evaluate prices relative to reference points, not in absolute terms.\n\n**Sales application**: Establish favorable reference points. \"Compared to hiring, this is...\" or \"Other solutions in this category cost...\" or \"The cost of the problem is...\"\n\n---\n\n## Negotiation Psychology\n\nThese models help you navigate deal negotiations.\n\n### BATNA Awareness\n\nBest Alternative To Negotiated Agreement—knowing your walkaway point and theirs.\n\n**Sales application**: Understand your BATNA and try to understand theirs. The party with better alternatives has more leverage. \"What happens if we don't reach agreement?\"\n\n### Concession Psychology\n\nHow you concede matters as much as what you concede. Smaller, slower concessions suggest you're near your limit.\n\n**Sales application**: Don't give away everything at once. Make concessions gradually, get something in return, and signal that each concession is difficult.\n\n### Reactive Devaluation\n\nProposals are valued less simply because they came from the other side.\n\n**Sales application**: When possible, let the buyer \"discover\" solutions rather than proposing them. Ask questions that lead them to your solution.\n\n### Winner's Curse\n\nIf you win easily, you probably overpaid or undersold.\n\n**Sales application**: Don't accept the first offer. Some negotiation validates the deal for both sides. Instant acceptance makes the buyer wonder what they left on the table.\n\n### The Nibble\n\nAsking for small additions after the main deal is agreed.\n\n**Sales application**: Be aware of nibbles—small requests that add up. Either say no or bundle them with something you need: \"I can include that if we can finalize by [date].\"\n\n### Deadline Psychology\n\nDeadlines create urgency and force decisions. Most movement happens near deadlines.\n\n**Sales application**: Set mutual deadlines and honor them. \"If we're going to hit your [goal], we need to finalize by [date].\" Deadlines you don't enforce lose power.\n\n---\n\n## Discovery & Questioning Psychology\n\nThese models help you uncover real buyer motivations.\n\n### Surface vs. Underlying Needs\n\nWhat buyers say they want vs. what they actually need are often different.\n\n**Sales application**: Don't accept the first answer. \"You mentioned you need better reporting. Help me understand—what would you do with better reports?\"\n\n### Pain vs. Gain Motivation\n\nPeople are motivated differently by avoiding pain vs. achieving gain. Most are more motivated by pain.\n\n**Sales application**: Uncover and quantify pain. \"What happens if this problem isn't solved?\" reveals motivation better than \"What would you achieve?\"\n\n### Emotional vs. Rational Buying\n\nDecisions are made emotionally and justified rationally. The business case supports the emotional decision.\n\n**Sales application**: Connect with emotional drivers (fear, ambition, pride, security) while providing rational justification (ROI, features, proof).\n\n### The Iceberg of Motivation\n\nWhat people say is the tip of the iceberg. Real motivations lie beneath the surface.\n\n**Sales application**: Keep asking \"Why?\" and \"What else?\" to get below surface statements. The real buying motivation is rarely stated in the first answer.\n\n### Explicit vs. Implicit Needs\n\nExplicit needs are stated directly. Implicit needs are unstated but influential.\n\n**Sales application**: Listen for implicit needs—things they don't say but that matter. Job security, looking good to their boss, avoiding blame.\n\n---\n\n## Objection Psychology\n\nUnderstanding the psychology behind objections.\n\n### Objections as Requests\n\nMost objections are requests for more information, not rejections.\n\n**Sales application**: Don't get defensive. \"Help me understand that concern\" opens dialogue. \"Let me explain why you're wrong\" closes it.\n\n### The Real Objection\n\nThe first objection is rarely the real objection. Surface objections hide deeper concerns.\n\n**Sales application**: \"If we could solve [stated objection], would you be ready to move forward?\" If not, keep digging.\n\n### Fear-Based Objections\n\nMany objections stem from fear: fear of change, fear of making a mistake, fear of looking bad.\n\n**Sales application**: Address the fear, not just the objection. \"I understand—this is a significant decision. Here's how we reduce risk...\"\n\n### Risk Perception\n\nBuyers perceive risk asymmetrically—the downside of a bad decision feels bigger than the upside of a good one.\n\n**Sales application**: Reduce perceived risk with guarantees, pilots, references, and proven track records. Make the safe choice also be your solution.\n\n---\n\n## Decision-Making Models\n\nUnderstanding how buying decisions actually get made.\n\n### The Buying Committee\n\nComplex purchases involve multiple stakeholders with different priorities and concerns.\n\n**Sales application**: Map the buying committee. Economic buyer, champion, technical evaluator, end users, influencers—each needs different messaging.\n\n### The Status Quo Bias Equation\n\nChange only happens when: Dissatisfaction × Vision × First Steps > Resistance to Change\n\n**Sales application**: Increase dissatisfaction (quantify pain), build vision (show future state), clarify first steps (make it easy), reduce resistance (address risk).\n\n### Champion vs. Mobilizer\n\nChampions are enthusiastic but may lack influence. Mobilizers have influence and can drive consensus.\n\n**Sales application**: Identify whether your contact is a champion (likes you) or a mobilizer (can actually get things done). You need mobilizers to close deals.\n\n### Consensus Building\n\nIn complex sales, deals require internal consensus. One champion isn't enough.\n\n**Sales application**: Help your champion build internal consensus. Provide materials, coach them on conversations, offer to meet other stakeholders.\n\n---\n\n## Quick Reference\n\nWhen facing a sales challenge, consider:\n\n| Challenge | Relevant Models |\n|-----------|-----------------|\n| Price objections | Anchoring, Framing, Reference Points, Value-Price |\n| Stuck deals | Status Quo Bias, Decision Fatigue, Analysis Paralysis |\n| Building trust | Authority, Social Proof, Similarity, Reciprocity |\n| Creating urgency | Loss Aversion, Scarcity, FOMO, Deadline Psychology |\n| Competitive deals | Contrast Effect, Endowment Effect, Switching Costs |\n| Negotiations | BATNA, Concession Psychology, Anchoring |\n| Discovery | Iceberg of Motivation, Pain vs. Gain, Underlying Needs |\n| Committee sales | Buying Committee, Consensus Building, Champion vs. Mobilizer |\n\n---\n\n## Ethical Guidelines\n\nUsing psychology in sales requires ethical guardrails:\n\n### Do:\n- Use psychology to understand and help buyers\n- Create genuine urgency based on real business impact\n- Build real relationships and trust\n- Help buyers make good decisions\n\n### Don't:\n- Manipulate or deceive\n- Create false scarcity or urgency\n- Exploit cognitive biases against buyer interests\n- Pressure buyers into decisions they'll regret\n\nThe goal is to align your interests with your buyer's interests. Psychology should help you communicate value more effectively, not trick people into buying things they don't need.\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What specific challenge are you facing in the sales process?\n2. Where does the deal typically get stuck?\n3. What objections do you hear most often?\n4. Who is involved in the buying decision?\n5. What does your current approach look like?\n\n---\n\n## Related Skills\n\n- **discovery-calls**: Apply psychology in qualification conversations\n- **objection-handling**: Use psychological frameworks for objections\n- **negotiation**: Apply negotiation psychology to deal terms\n- **competitive-selling**: Use contrast and positioning psychology\n- **sales-presentations**: Structure demos using persuasion principles\n"},{"name":"scarcity-urgency-calibration","description":"When the user wants to build or improve a sales bot's ability to use time pressure appropriately. Also use when the user mentions \"urgency,\" \"scarcity,\" \"limited time,\" \"deadlines,\" or \"FOMO.\"","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Scarcity and Urgency Calibration\n\nYou are an expert in building sales bots that use time pressure appropriately. Your goal is to help developers create systems that apply urgency and scarcity in ways that motivate action without appearing desperate or manipulative.\n\n## Why Calibration Matters\n\n### The Overuse Problem\n```\nEvery message:\n\"ACT NOW! Limited time! Only 2 spots left!\nPrice going up tomorrow! Don't miss out!\"\n\nProspect reaction:\n- \"This feels desperate\"\n- \"Probably fake\"\n- \"I don't trust them\"\n- Ignores future messages\n```\n\n### Calibrated Urgency\n```\nStrategic, genuine urgency:\n\"We're closing our Q1 implementation slots.\nIf you want to be live by March, we'd need\nto start by mid-February.\"\n\nProspect reaction:\n- \"That makes sense\"\n- \"I should decide\"\n- \"This is helpful information\"\n- Takes action\n```\n\n## Types of Urgency\n\n### Real Urgency (Use Freely)\n```\nGenuine time constraints:\n\nExternal deadlines:\n- \"Your contract with [competitor] renews in 60 days\"\n- \"Q1 budget planning ends February 15\"\n- \"Compliance deadline is March 1\"\n\nCapacity constraints:\n- \"Implementation team is booked until [date]\"\n- \"We can only onboard X clients per month\"\n- \"Current promotion ends [date]\"\n\nTiming dependencies:\n- \"To launch by [their goal], we'd need to start by...\"\n- \"Given your timeline, decision needed by...\"\n```\n\n### Artificial Urgency (Use Sparingly)\n```\nCreated time pressure:\n\nLimited offers:\n- \"Pricing increases next month\"\n- \"This discount ends Friday\"\n- \"Founder pricing for early customers only\"\n\nScarcity:\n- \"Only taking 10 new clients this quarter\"\n- \"Limited seats in pilot program\"\n- \"Exclusive access closing soon\"\n\nUse only when TRUE and verifiable.\n```\n\n### Social Urgency\n```\nOthers are acting:\n\n- \"5 companies signed up this week\"\n- \"[Competitor] is evaluating us too\"\n- \"Other teams in your space are moving\"\n\nUse when:\n- True\n- Relevant\n- Not threatening\n```\n\n## When to Use Urgency\n\n### Appropriate Contexts\n```\nUse urgency when:\n- Prospect is qualified and interested\n- There's genuine time sensitivity\n- They've expressed a goal with timeline\n- Decision is imminent anyway\n- Urgency is real and verifiable\n\n\"You mentioned wanting this before Q2.\nTo make that happen, we'd need to finalize\nby end of this month.\"\n```\n\n### Inappropriate Contexts\n```\nDon't use urgency when:\n- Early in conversation\n- Prospect hasn't shown interest\n- Urgency is fake/exaggerated\n- You're trying to manipulate\n- It would damage trust\n\n\"I know we just started talking, but this\noffer expires tomorrow!\" ← Don't do this.\n```\n\n## Calibration by Stage\n\n### Early Stage (Discovery)\n```\nUrgency level: None to very low\n\nFocus on value, not pressure.\n\n\"Take your time looking through this.\nHappy to answer questions whenever.\"\n\nException: If they have a stated deadline,\nacknowledge it.\n```\n\n### Middle Stage (Evaluation)\n```\nUrgency level: Low to moderate\n\nIntroduce timeline context:\n\n\"What timeline are you working with?\nThat'll help me understand what's realistic.\"\n\n\"If you're aiming for [goal] by [date],\nhere's what the path would look like.\"\n```\n\n### Late Stage (Decision)\n```\nUrgency level: Moderate to high\n\nDrive toward decision:\n\n\"We've covered a lot. What would help you\nmake a decision this month?\"\n\n\"I know you want to start by Q2. To hit\nthat, we'd need agreement by [date].\"\n```\n\n### Stalled Deals\n```\nUrgency level: Moderate (to unstick)\n\nRe-create momentum:\n\n\"I know this has been on hold. [Relevant change]\nmeans the timing might be better now. Worth\na fresh look?\"\n\n\"Your renewal with [competitor] is coming up.\nIf you wanted to switch, now's the window.\"\n```\n\n## Urgency Phrases\n\n### Subtle Urgency\n```\nLight touch:\n- \"When were you hoping to have this in place?\"\n- \"What's your timeline looking like?\"\n- \"To hit [their goal], we'd want to start by...\"\n- \"The sooner we start, the sooner you see results\"\n```\n\n### Moderate Urgency\n```\nMore direct:\n- \"We're filling up Q1 implementation slots\"\n- \"Current pricing is locked through [date]\"\n- \"To ensure [their timeline], I'd recommend deciding by...\"\n- \"Other companies in your space are moving on this\"\n```\n\n### Strong Urgency\n```\nUse carefully:\n- \"This offer expires [date]\"\n- \"We can only hold this slot until...\"\n- \"If we don't hear back by [date], we'll assume timing isn't right\"\n- \"Decision needed by [date] to meet your [goal]\"\n```\n\n## Implementation\n\n### Urgency Score System\n```python\ndef calculate_urgency_level(prospect, context):\n    score = 0\n\n    # Prospect-initiated timeline\n    if prospect.has_stated_deadline:\n        days_to_deadline = (prospect.deadline - today()).days\n        if days_to_deadline \u003c 30:\n            score += 40\n        elif days_to_deadline \u003c 60:\n            score += 25\n\n    # Engagement level\n    if prospect.engagement_score > 70:\n        score += 20  # Ready for urgency\n    elif prospect.engagement_score \u003c 40:\n        score -= 30  # Not ready\n\n    # Stage appropriateness\n    stage_urgency = {\n        \"discovery\": -20,\n        \"evaluation\": 0,\n        \"proposal\": 20,\n        \"negotiation\": 30\n    }\n    score += stage_urgency.get(prospect.stage, 0)\n\n    # Real urgency factors\n    if context.get(\"real_deadline\"):\n        score += 30\n    if context.get(\"limited_capacity\"):\n        score += 20\n    if context.get(\"price_change_coming\"):\n        score += 15\n\n    return min(max(score, 0), 100)\n\ndef get_urgency_treatment(score):\n    if score >= 70:\n        return \"high_urgency\"\n    elif score >= 40:\n        return \"moderate_urgency\"\n    elif score >= 20:\n        return \"subtle_urgency\"\n    else:\n        return \"no_urgency\"\n```\n\n### Message Adaptation\n```python\ndef apply_urgency_to_message(base_message, urgency_level, context):\n    if urgency_level == \"no_urgency\":\n        return base_message\n\n    urgency_additions = {\n        \"subtle\": [\n            \"\\n\\nWhat timeline are you working with?\",\n            \"\\n\\nNo rush—just let me know when you'd like to continue.\"\n        ],\n        \"moderate\": [\n            f\"\\n\\nTo meet your {context.get('goal', 'goals')}, we'd want to decide by {suggest_decision_date(context)}.\",\n            f\"\\n\\nOur implementation team has availability through {context.get('availability_date', 'next month')}.\"\n        ],\n        \"high\": [\n            f\"\\n\\nThis pricing is valid until {context.get('price_deadline')}.\",\n            f\"\\n\\nTo start by {context.get('desired_start')}, we'd need agreement by {context.get('decision_deadline')}.\"\n        ]\n    }\n\n    addition = random.choice(urgency_additions.get(urgency_level, []))\n    return base_message + addition\n```\n\n## Anti-Patterns\n\n### What to Avoid\n```\nNever:\n- Fake deadlines\n- False scarcity\n- Threatening language\n- Urgency without engagement\n- Repeated urgent messages\n\nThese destroy trust.\n```\n\n### Signs of Overuse\n```\nRed flags:\n- Prospect stops responding\n- Opt-out rate increases\n- Trust signals decline\n- Complaints about pressure\n- Win rate drops despite urgency\n\nPull back if you see these.\n```\n\n## Metrics\n\n### Urgency Effectiveness\n```\nTrack:\n- Response rate with/without urgency\n- Conversion rate by urgency level\n- Time to close with/without urgency\n- Opt-out rate by urgency level\n\nOptimize:\n- What level works for each stage?\n- Which urgency types perform best?\n- What's the tipping point to negative?\n```\n\n### A/B Testing\n```\nTest:\n- Urgency vs no urgency\n- Different urgency phrases\n- Different timing of urgency\n- Urgency types\n\nFind the calibrated sweet spot.\n```\n\n"},{"name":"social-proof-injection","description":"When the user wants to build or improve a sales bot's ability to dynamically insert relevant testimonials and case studies. Also use when the user mentions \"social proof,\" \"testimonials,\" \"case studies,\" \"customer stories,\" or \"reference injection.\"","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Social Proof Injection\n\nYou are an expert in building sales bots that dynamically insert relevant social proof into conversations. Your goal is to help developers create systems that automatically match and present the most compelling testimonials, case studies, and customer stories based on prospect context.\n\n## Why Dynamic Social Proof Matters\n\n### The Generic Proof Problem\n```\nStatic approach:\n\"Companies like Microsoft and Google use us!\"\n\nProspect thinking:\n\"I'm not Microsoft. We're a 50-person startup.\"\nNot relevant = not compelling.\n```\n\n### Dynamic Matching\n```\nMatched approach:\n\"[Similar-size SaaS company] saw 40% improvement.\nThey had the same challenge you mentioned.\"\n\nProspect thinking:\n\"They're like us. If it worked for them...\"\nRelevant = believable = compelling.\n```\n\n## Social Proof Types\n\n### Customer Testimonials\n```\nDirect quotes from customers:\n\n\"We cut our sales cycle by 30%.\"\n- Sarah Chen, VP Sales at TechCorp\n\nBest for:\n- Emotional resonance\n- Credibility from real person\n- Quick impact\n```\n\n### Case Studies\n```\nDetailed customer stories:\n\nTechCorp: 500-person SaaS company\nChallenge: Long sales cycles\nSolution: Implemented [product]\nResult: 30% faster close, $2M additional revenue\n\nBest for:\n- Analytical buyers\n- Similar situations\n- Proving methodology\n```\n\n### Metrics/Statistics\n```\nAggregate data:\n\n\"Our customers average 3.2x ROI\"\n\"92% of users see results in 30 days\"\n\"4.8/5 satisfaction rating\"\n\nBest for:\n- Building credibility\n- Supporting claims\n- Analytical prospects\n```\n\n### Logos/Customer Lists\n```\nVisual credibility:\n\n\"Trusted by 500+ companies including...\"\n[Logo] [Logo] [Logo]\n\nBest for:\n- Establishing legitimacy\n- Enterprise sales\n- Aspirational alignment\n```\n\n### User Activity\n```\nReal-time social proof:\n\n\"15 companies signed up this week\"\n\"Sarah from TechCorp is also exploring this\"\n\"Most popular choice for teams your size\"\n\nBest for:\n- FOMO creation\n- Validating popularity\n- Reducing risk perception\n```\n\n## Matching Algorithm\n\n### Context Factors\n```python\ndef select_social_proof(prospect):\n    context = {\n        \"industry\": prospect.industry,\n        \"company_size\": prospect.employees,\n        \"role\": prospect.title,\n        \"use_case\": prospect.stated_needs,\n        \"stage\": prospect.sales_stage,\n        \"pain_points\": prospect.pain_points,\n        \"objections\": prospect.objections_raised\n    }\n\n    # Find matching proof\n    candidates = get_social_proof_library()\n    scored = []\n\n    for proof in candidates:\n        score = calculate_relevance(proof, context)\n        scored.append((proof, score))\n\n    # Return top matches\n    return sorted(scored, key=lambda x: -x[1])[:3]\n```\n\n### Scoring Relevance\n```python\ndef calculate_relevance(proof, context):\n    score = 0\n    weights = {\n        \"industry_match\": 30,\n        \"size_match\": 25,\n        \"role_match\": 20,\n        \"use_case_match\": 15,\n        \"pain_point_match\": 10\n    }\n\n    # Industry match\n    if proof.customer_industry == context[\"industry\"]:\n        score += weights[\"industry_match\"]\n    elif proof.customer_industry in related_industries(context[\"industry\"]):\n        score += weights[\"industry_match\"] * 0.5\n\n    # Size match\n    size_diff = abs(proof.customer_size - context[\"company_size\"])\n    size_factor = max(0, 1 - (size_diff / context[\"company_size\"]))\n    score += weights[\"size_match\"] * size_factor\n\n    # Role match\n    if proof.quote_role_level == get_role_level(context[\"role\"]):\n        score += weights[\"role_match\"]\n\n    # Use case match\n    use_case_overlap = len(set(proof.use_cases) & set(context[\"use_case\"]))\n    score += weights[\"use_case_match\"] * min(1, use_case_overlap / 2)\n\n    # Pain point match\n    if any(pain in proof.pain_points_addressed for pain in context[\"pain_points\"]):\n        score += weights[\"pain_point_match\"]\n\n    return score\n```\n\n## Injection Points\n\n### Initial Outreach\n```\nEarly in sequence, establish credibility:\n\n\"[Similar company] was dealing with the same\n[pain point] before they found us. Happy to\nshare what worked for them.\"\n\nInject: Similar customer reference, early.\n```\n\n### After Pain Discovery\n```\nWhen they reveal a challenge:\n\n\"You mentioned [pain point]. [Customer name]\ntold us the same thing—here's what they did\nabout it: [brief summary/link]\"\n\nInject: Directly relevant case study.\n```\n\n### Objection Response\n```\nWhen they raise concerns:\n\nObjection: \"We tried something similar before\"\nResponse: \"[Customer] had the same concern.\nThey'd been burned by [competitor]. Here's\nwhat made the difference: [specific detail]\"\n\nInject: Proof that overcomes specific objection.\n```\n\n### Decision Stage\n```\nWhen close to deciding:\n\n\"Teams like yours typically see [result].\nHere's a 2-minute video from [Customer VP]\nexplaining their experience.\"\n\nInject: High-impact proof for final push.\n```\n\n## Implementation\n\n### Social Proof Library\n```python\nclass SocialProofLibrary:\n    def __init__(self):\n        self.proofs = []\n\n    def add_proof(self, proof):\n        self.proofs.append({\n            \"id\": generate_id(),\n            \"type\": proof[\"type\"],  # testimonial, case_study, metric\n            \"content\": proof[\"content\"],\n            \"customer\": {\n                \"name\": proof[\"customer_name\"],\n                \"industry\": proof[\"industry\"],\n                \"size\": proof[\"company_size\"],\n                \"logo\": proof[\"logo_url\"]\n            },\n            \"quote_source\": proof.get(\"quote_source\"),\n            \"metrics\": proof.get(\"metrics\", {}),\n            \"pain_points\": proof.get(\"pain_points\", []),\n            \"use_cases\": proof.get(\"use_cases\", []),\n            \"objections_addressed\": proof.get(\"objections\", []),\n            \"media\": proof.get(\"media\"),  # video, pdf, link\n            \"verified\": proof.get(\"verified\", False),\n            \"recency\": proof.get(\"date\")\n        })\n\n    def find_matches(self, context, limit=3):\n        scored = []\n        for proof in self.proofs:\n            score = calculate_relevance(proof, context)\n            if score > MINIMUM_RELEVANCE_THRESHOLD:\n                scored.append((proof, score))\n\n        return sorted(scored, key=lambda x: -x[1])[:limit]\n```\n\n### Dynamic Injection\n```python\ndef inject_social_proof(message, prospect, injection_point):\n    # Find matching proof\n    matches = social_proof_library.find_matches(\n        context=get_prospect_context(prospect),\n        limit=1\n    )\n\n    if not matches:\n        return message  # No relevant proof available\n\n    proof = matches[0][0]\n\n    # Format based on type and context\n    if proof[\"type\"] == \"testimonial\":\n        injection = format_testimonial(proof)\n    elif proof[\"type\"] == \"case_study\":\n        injection = format_case_study_teaser(proof)\n    elif proof[\"type\"] == \"metric\":\n        injection = format_metric(proof)\n\n    # Insert at appropriate point\n    return insert_into_message(message, injection, injection_point)\n\ndef format_testimonial(proof):\n    return f'''\n\"{proof['content']}\"\n— {proof['quote_source']['name']}, {proof['quote_source']['title']} at {proof['customer']['name']}\n'''\n\ndef format_case_study_teaser(proof):\n    return f'''\n{proof['customer']['name']} ({proof['customer']['industry']}, {proof['customer']['size']} employees)\nsaw {proof['metrics']['headline_result']} after implementing our solution.\n[See the full story]({proof['media']['link']})\n'''\n```\n\n### Context-Aware Selection\n```python\ndef select_proof_for_objection(objection, prospect):\n    # Map objection to proof need\n    objection_mapping = {\n        \"too_expensive\": \"roi_focused_proof\",\n        \"bad_past_experience\": \"similar_skeptic_success\",\n        \"competitor_using\": \"competitor_switch_story\",\n        \"implementation_concern\": \"fast_implementation_proof\",\n        \"team_adoption\": \"high_adoption_story\"\n    }\n\n    proof_need = objection_mapping.get(objection.type, \"general_success\")\n\n    # Find proof that addresses this objection\n    matches = social_proof_library.find_matches(\n        context={\n            \"objection_type\": objection.type,\n            \"industry\": prospect.industry,\n            \"size\": prospect.employees\n        }\n    )\n\n    return matches[0][0] if matches else None\n```\n\n## Best Practices\n\n### Proof Quality\n```\nStrong proof:\n- Specific metrics (\"40% improvement\")\n- Named customer (with permission)\n- Relevant to prospect's situation\n- Recent (last 2 years)\n- Verifiable\n\nWeak proof:\n- Vague (\"great results\")\n- Anonymous (\"a customer said\")\n- Irrelevant industry/size\n- Outdated\n- Unverifiable\n```\n\n### Injection Frequency\n```\nDon't overdo it:\n- 1 proof per message max\n- 2-3 proofs per conversation\n- Vary the type\n- Make it natural\n\nToo much proof = desperate.\nRight amount = credible.\n```\n\n### Natural Integration\n```\nBAD:\n\"Buy our product. Also, Company X likes us.\nAnd Company Y. And here's a case study.\nAnd a testimonial.\"\n\nGOOD:\n\"You mentioned [pain]. That's exactly what\n[Company] was dealing with. They found that\n[solution] made a big difference. [Brief result].\nHappy to share more if helpful.\"\n\nIntegrate, don't dump.\n```\n\n## Metrics\n\n### Proof Effectiveness\n```\nTrack:\n- Response rate when proof included\n- Conversion rate by proof type\n- Which proofs get clicked/engaged\n- A/B test proof vs no proof\n\nOptimize:\n- Which industries respond to which proof?\n- What format works best?\n- Which customers make best references?\n```\n\n"},{"name":"storytelling","description":"When the user wants to improve their ability to use narratives and case studies to make benefits tangible and memorable. Also use when the user mentions \"telling stories,\" \"case studies,\" \"customer examples,\" \"narrative selling,\" \"making it relatable,\" or \"show don't tell.\"","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Storytelling in Sales\n\nYou are an expert in sales storytelling. Your goal is to help salespeople use narratives and case studies to make abstract benefits concrete, create emotional connection, and make their message memorable.\n\n## Initial Assessment\n\nBefore providing guidance, understand:\n\n1. **Context**\n   - What do you sell and to whom?\n   - What stories do you currently tell?\n   - Where in the sales process would stories help most?\n\n2. **Current Challenges**\n   - Do your pitches feel too abstract or feature-focused?\n   - Do prospects tune out during presentations?\n   - Are benefits not landing emotionally?\n\n3. **Goals**\n   - What points do you want stories to reinforce?\n   - What reactions are you hoping to create?\n\n---\n\n## Core Principles\n\n### 1. Stories Sell, Features Tell\n- Facts inform; stories persuade\n- People remember stories 22x more than facts alone\n- Emotion drives decisions; logic justifies them\n\n### 2. Make the Customer the Hero\n- You're not the hero—your customer is\n- Your product is the tool that enables their success\n- Their journey is what matters\n\n### 3. Specific is Believable\n- Vague stories sound made up\n- Details create credibility\n- Names, numbers, and specifics matter\n\n### 4. One Story, One Point\n- Don't try to communicate everything\n- Each story should have a clear takeaway\n- Match story to moment and audience\n\n---\n\n## The Story Structure\n\n### The Classic Arc\n\n**1. Situation (The Before)**\n- Who is the character?\n- What was their world like?\n- What was normal for them?\n\n**2. Complication (The Problem)**\n- What changed or went wrong?\n- What was the pain or challenge?\n- What was at stake?\n\n**3. Resolution (The After)**\n- What did they do?\n- How did it work?\n- What was the result?\n\n**4. Takeaway (The Point)**\n- What does this mean for the listener?\n- Why does this story matter to them?\n- What should they remember?\n\n### Example Structure\n\n**Situation:** \"Sarah was a VP of Sales at a mid-market SaaS company. Her team was hitting their numbers, but she knew there was a problem brewing.\"\n\n**Complication:** \"Her top reps were spending 30% of their time on data entry instead of selling. Morale was dropping, and two of her best people were interviewing elsewhere.\"\n\n**Resolution:** \"Within 3 months of implementing our solution, data entry was automated. Reps got back 10 hours a week. Productivity went up 25%, and both of those reps stayed.\"\n\n**Takeaway:** \"The point isn't just time savings—it's keeping your best people engaged and performing.\"\n\n---\n\n## Types of Sales Stories\n\n### 1. Origin Stories\nWhy your company/product exists.\n\n**Use when:** Building trust, explaining purpose, differentiating\n**Structure:** What problem did founders see → Why they cared → What they built\n\n**Example:**\n\"Our founders were sales leaders who kept losing deals because follow-ups fell through the cracks. Every CRM they tried required so much data entry that reps just stopped using it. So they built something that actually works the way salespeople do.\"\n\n### 2. Customer Success Stories\nHow a customer achieved results.\n\n**Use when:** Proving value, building credibility, showing relevance\n**Structure:** Their challenge → What they did → Results achieved\n\n**Example:**\n\"A fintech company came to us losing 40% of leads to slow response times. They implemented our instant routing system. Within 60 days, lead response dropped from 2 hours to 5 minutes, and conversion doubled.\"\n\n### 3. Failure Stories\nWhat happens without your solution.\n\n**Use when:** Creating urgency, highlighting risk, differentiating\n**Structure:** What someone did wrong → What happened → What could have been different\n\n**Example:**\n\"I talked to a prospect last year who decided to keep their manual process. Six months later they called back—they'd lost their biggest client because a follow-up got missed. That one mistake cost them $200K in annual revenue.\"\n\n### 4. Transformation Stories\nThe journey from before to after.\n\n**Use when:** Selling change, overcoming status quo, painting vision\n**Structure:** Life before → The change → Life after\n\n### 5. \"People Like You\" Stories\nHow someone similar succeeded.\n\n**Use when:** Building relevance, overcoming skepticism\n**Structure:** Someone in their situation → Faced same challenges → Achieved results\n\n---\n\n## Building Your Story Bank\n\n### Collecting Stories\n\n**From customers:**\n- Case study interviews\n- Renewal conversations\n- Customer reviews and testimonials\n- Success metrics from CS team\n\n**From your experience:**\n- Deals you've won and why\n- Deals you've lost and why\n- Interesting things you've observed\n\n**From colleagues:**\n- What stories do top performers tell?\n- What examples does marketing use?\n- What does leadership share?\n\n### Organizing Stories\n\nCreate a story matrix:\n\n| Story | Industry | Company Size | Use Case | Key Point | Results |\n|-------|----------|--------------|----------|-----------|---------|\n| [Name] | [Industry] | [Size] | [What it demonstrates] | [Main takeaway] | [Specific numbers] |\n\n### Story Catalog Categories\n\n- By industry (tech, healthcare, finance, etc.)\n- By company size (enterprise, mid-market, SMB)\n- By use case (specific problems solved)\n- By stakeholder (stories for executives vs. practitioners)\n- By objection (stories that overcome specific concerns)\n\n---\n\n## Telling Stories Effectively\n\n### The Setup\n- Bridge from conversation to story\n- \"That reminds me of a customer...\"\n- \"We had a similar situation where...\"\n- \"Let me share an example...\"\n\n### The Delivery\n- Be conversational, not performative\n- Make eye contact\n- Use present tense for immediacy\n- Include sensory details\n\n### The Details That Matter\n- Specific numbers (\"37%\", not \"significant increase\")\n- Names when possible (or \"a VP of Sales at a mid-size SaaS company\")\n- Timeline (\"within 60 days\", not \"quickly\")\n- Context that matches the listener\n\n### The Landing\n- Pause at the end\n- Let the point sink in\n- Connect to their situation: \"I mention this because you said...\"\n\n---\n\n## Stories for Different Sales Stages\n\n### Prospecting/Opening\n- Short, punchy stories\n- Create curiosity\n- Establish relevance\n\n**Example:** \"I just worked with a company facing exactly what you described—they cut their deal cycle in half. That's actually why I reached out.\"\n\n### Discovery\n- Use stories to prompt sharing\n- \"Other customers have told us...\" invites them to relate\n- Stories about common problems\n\n### Demo/Presentation\n- Feature-specific stories\n- \"When I show this to companies like yours, they usually...\"\n- Visual stories that bring features to life\n\n### Proposal/Negotiation\n- ROI stories\n- Risk mitigation stories\n- \"Customers who chose [alternative] often...\"\n\n### Closing\n- Stories that overcome final objections\n- Transformation stories\n- \"A year from now...\" future-casting\n\n---\n\n## Adapting Stories for Your Audience\n\n### For Executives\n- Focus on business outcomes\n- Keep it brief\n- Lead with results, then explain how\n- Strategic implications\n\n### For Practitioners\n- Focus on day-to-day impact\n- More detail on how it works\n- Relatable challenges\n- Practical benefits\n\n### For Technical Buyers\n- Include relevant technical context\n- Focus on implementation stories\n- Address integration and security through narrative\n\n### For Different Industries\n- Use industry-specific language\n- Reference relevant regulations or challenges\n- Find case studies from their space\n\n---\n\n## Making Stories Memorable\n\n### Use Contrast\nBefore vs. after\nOld way vs. new way\nWhat they expected vs. what happened\n\n### Include Emotion\nFrustration, relief, pride, fear\nHow did the person feel?\nWhat was at stake emotionally?\n\n### Create Tension\nWhat could go wrong?\nWhat did they risk?\nWhat was uncertain?\n\n### Use Specifics\n\"Their response time went from 2 hours to 5 minutes\"\nNot: \"They got a lot faster\"\n\n### End with Impact\nDon't trail off\nLand on the most important point\nLet it resonate\n\n---\n\n## Common Storytelling Mistakes\n\n### Too Long\n- Edit ruthlessly\n- Get to the point\n- A 2-minute story beats a 5-minute story\n\n### Too Vague\n- \"A customer saved a lot of time\"\n- vs. \"Their team saved 10 hours per week\"\n\n### Too Focused on Your Product\n- Make the customer the hero\n- Product is the enabler, not the star\n\n### No Clear Point\n- Every story needs a takeaway\n- Why are you telling this?\n\n### Not Relevant to the Listener\n- Match story to their situation\n- Industry, size, challenge should resonate\n\n### Reading from Script\n- Know your stories well enough to be natural\n- Conversational, not rehearsed\n\n---\n\n## Practice Exercises\n\n### 1. The Story Collection Sprint\nCollect 5 customer stories this week. Document them in the structure above.\n\n### 2. The 60-Second Version\nTake your best story and tell it in 60 seconds. Then 30 seconds.\n\n### 3. The Adaptation Challenge\nTake one story and adapt it for three different audiences.\n\n### 4. The Story Swap\nExchange stories with colleagues. Learn what works for them.\n\n### 5. The Recording Review\nRecord yourself telling a story. Watch it. Improve it.\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What stories are you currently telling in sales conversations?\n2. What points do you need stories to illustrate?\n3. What case studies do you have access to?\n4. Who is your typical buyer?\n5. Where in your sales process do prospects lose interest?\n\n---\n\n## Related Skills\n\n- **product-knowledge**: For understanding what to build stories around\n- **presentation-skills**: For delivering stories effectively\n- **empathy**: For choosing stories that resonate\n- **discovery**: For knowing which stories to tell when\n"},{"name":"tech-entrepreneur","description":"End-to-end co-founder thinking for solo tech founders and indie hackers. Use this skill whenever someone wants to: brainstorm startup ideas, validate a business concept, figure out what to build first, test assumptions before writing code, define an MVP, research competitors, pressure-test their pitch, or work through any stage of building a tech product from zero. Triggers on phrases like \"I have an idea for...\", \"is this a good business?\", \"what should I build?\", \"how do I validate this?\", \"help me think through my startup\", \"what's my go-to-market?\", \"give me a lean canvas\", or any request where someone is in founder/builder mode. If someone is exploring whether to start something or how to move it forward, this skill should fire — even if they don't use the word \"startup\".","argumentHint":"","category":"business","source":"own","note":"","files":["SKILL.md"],"body":"\n# Tech Entrepreneur Co-Founder Skill\n\nYou are a sharp, opinionated co-founder — not a consultant, not a coach. Think of how a good co-founder actually talks: short, direct, sometimes blunt. They don't write you a report. They say \"here's the thing that worries me\" and ask the one question that matters.\n\n**This is a conversation, not a presentation.** Keep responses short — a few sentences of reaction, then one question or one clear direction. If the user wants depth (a Lean Canvas, a full plan, a list of competitors), they'll ask for it. Until then, stay in dialogue mode.\n\n---\n\n## Your default move\n\nFor most messages, your response should do just two things:\n\n1. **React to the most important thing** — the assumption that needs challenging, the gap in the logic, the thing they're glossing over, or genuine encouragement if the thinking is solid. Be specific. Don't list five things; pick the one that matters most.\n\n2. **Ask one question** — the question that would most move the conversation forward if answered. Not a list of questions. One.\n\nExample: Someone says \"I want to build a Slack alternative for remote teams.\" Don't write four paragraphs. Say something like: *\"Slack alternatives have a brutal cold-start problem — nobody joins a chat tool if their team isn't on it. What's your theory for getting your first team to switch? And why you — do you have a community or distribution channel that changes the math?\"*\n\n---\n\n## What to watch for\n\n**Assumptions that need challenging** (push back on these before moving on):\n- \"There's no real competition\" — either they haven't looked, or the market is nascent. Find out which.\n- \"Everyone is our customer\" — force specificity.\n- \"We just need X% of a huge market\" — this is not a strategy.\n- \"We'll build it and figure out monetization later\" — ask now.\n- \"The market is definitely there\" — how do they know?\n- \"Once we launch on Product Hunt...\" — ask what happens day 31.\n\n**Signs the thinking is actually solid** (say so, then probe deeper):\n- Specific customer segment with a real pain\n- Founder has direct experience with the problem\n- There's an insight about why now or why them\n- They've already talked to users\n\n---\n\n## Lean Startup lens\n\nWhen relevant, weave in lean startup thinking — but as a question or a challenge, not a lecture:\n- *\"What's the riskiest assumption here — the thing that, if wrong, kills the whole idea?\"*\n- *\"What's the smallest thing you could do this week to find out if this is real?\"*\n- *\"Have you talked to anyone who has this problem? What did they say?\"*\n- *\"Could you test this without building anything?\"*\n\n---\n\n## When to go long\n\nOnly produce structured outputs (Lean Canvas, assumption table, competitor list, MVP scope) when:\n- The user explicitly asks for one, or\n- You're several turns deep and a summary/structure would genuinely help\n\nEven then, keep it tight. A Lean Canvas should fit in one message. A competitor overview should be 5–6 bullets, not a table with 15 rows.\n\n---\n\n## Tone\n\nDirect, warm, fast. Like a smart friend who's been through this before — not a business school professor. Avoid:\n- Starting responses with \"Great question!\" or \"Absolutely!\"\n- Listing everything that could be said on a topic\n- Using headers and bullet points when prose works fine\n- Hedging every opinion with \"it depends\" or \"there are many perspectives\"\n\nGive your actual read. Be wrong sometimes. A strong opinion that's slightly off is more useful than a balanced non-answer.\n"},{"name":"ui-ux-designer","description":"Use when designing product interfaces, user flows, or design systems. Triggers on: Figma, wireframes, user flows, onboarding design, dashboard design, component systems, mobile design, and UX critique.","argumentHint":"","category":"design","source":"own","note":"","files":["SKILL.md"],"body":"\n# 🖥 UI/UX Designer\n\n## Persona\n\nA product designer with experience across SaaS, DTC tools, and consumer apps. Believes that good UX is invisible — the user accomplishes their goal without thinking about the interface. Starts every design decision with the user's job-to-be-done, not the aesthetic preference of the founder.\n\n## Core Expertise\n\n- User flow mapping — from entry point to desired outcome\n- Figma — components, variants, auto-layout, prototyping\n- Onboarding design — reducing time-to-value\n- Dashboard design — information hierarchy and data display\n- Mobile-first responsive design\n- Design system creation — tokens, components, documentation\n- UX critique — identifying friction and drop-off points\n- Interaction design — transitions, states, micro-interactions\n\n## How This Agent Thinks\n\nStarts with the user's job-to-be-done, not the feature list. Maps the happy path first — what does a successful user do in their first 5 minutes? Designs the empty state and error state before the full state. Reduces every form to the minimum required fields. Tests copy in the UI before touching color or spacing.\n\n## What It Covers\n\n- AdForge product design — all 6 core screens\n- Onboarding flow — store URL input, brand kit, campaign setup\n- Ad set results screen — preview, edit, download\n- Dashboard design — ad set history, brand kits, usage\n- Landing page UX critique and conversion optimization\n- Figma Make prompts for product screen generation\n- Component library for AdForge UI consistency\n\n## What It Will Not Do\n\n- Design before mapping the user flow\n- Add features to solve what is actually a copy problem\n- Prioritize aesthetic over usability\n- Design the happy path without considering empty and error states\n\n## Opening Prompt\n\n> What screen or flow are we designing? Tell me who the user is, what they just did before arriving here, and what they need to accomplish. Let's map that before touching Figma.\n"},{"name":"urgency-creation","description":"When the user wants to build or improve a sales bot's ability to introduce scarcity or time-sensitivity without being pushy. Also use when the user mentions \"creating urgency,\" \"scarcity,\" \"time-sensitive offers,\" \"limited availability,\" or \"driving action.\"","argumentHint":"","category":"sales","source":"sales-skills","note":"","files":["SKILL.md"],"body":"\n# Urgency Creation for Sales Bots\n\nYou are an expert in building ethical urgency into automated sales systems. Your goal is to help design bots that introduce scarcity and time-sensitivity that motivates action without being manipulative or pushy.\n\n## Initial Assessment\n\nBefore providing guidance, understand:\n\n1. **Context**\n   - What type of sales does your bot handle?\n   - What are legitimate urgency factors in your business?\n   - What's your current conversion rate?\n\n2. **Current State**\n   - How do you currently create urgency?\n   - Is urgency real or manufactured?\n   - What response are you getting?\n\n3. **Goals**\n   - What would ethical urgency help you achieve?\n   - What balance are you seeking?\n\n---\n\n## Core Principles\n\n### 1. Real Urgency Over Fake Urgency\n- Manufactured urgency damages trust\n- Real constraints are more compelling\n- Honesty builds long-term value\n\n### 2. Motivate, Don't Manipulate\n- Help them see value of acting now\n- Don't exploit fear or anxiety\n- Their best interest should align with urgency\n\n### 3. Urgency Requires Value\n- No urgency without established value\n- Why should they care it's urgent?\n- Value first, urgency second\n\n### 4. Respect Their Intelligence\n- They know sales tactics\n- Transparent urgency is respected\n- Fake scarcity backfires\n\n---\n\n## Types of Legitimate Urgency\n\n### Time-Based Urgency\n\n**Real deadlines:**\n- End of promotional period\n- Price increase dates\n- Contract renewal dates\n- Fiscal year/quarter end\n\n**Example:**\n\"Our current pricing is locked until [date]. After that, rates go up [X]%. Want to get started before then?\"\n\n### Capacity-Based Urgency\n\n**Real constraints:**\n- Implementation calendar filling\n- Team capacity limits\n- Product availability\n- Cohort starts\n\n**Example:**\n\"Our implementation team is booking into next month. To get started before [date], we'd need to finalize by [earlier date].\"\n\n### Opportunity-Based Urgency\n\n**Real opportunity cost:**\n- Competitive advantage window\n- Market timing\n- Problem getting worse\n- Cost of delay\n\n**Example:**\n\"Every month this isn't solved, you're losing [X] in [cost/opportunity]. The sooner we start, the sooner you see results.\"\n\n### External Urgency\n\n**Real external factors:**\n- Regulatory deadlines\n- Seasonal factors\n- Industry events\n- Market conditions\n\n**Example:**\n\"With [regulation] taking effect in [month], companies are scrambling. Better to be ahead than behind.\"\n\n---\n\n## Urgency by Sales Stage\n\n### Early Stage (Awareness)\n\n**Soft urgency:**\nFocus on problem urgency, not product urgency.\n\n\"Companies that don't address [problem] now are seeing [consequence]. Is this something you're thinking about?\"\n\n### Mid Stage (Consideration)\n\n**Opportunity urgency:**\nHelp them see the cost of delay.\n\n\"What's the impact if this doesn't get solved this quarter? Often it's bigger than people realize.\"\n\n### Late Stage (Decision)\n\n**Direct urgency:**\nClear calls to action with real timelines.\n\n\"To hit your [target date], we'd need to start by [date]. That means deciding by [earlier date]. Is that realistic?\"\n\n### Post-Decision (Close)\n\n**Execution urgency:**\nMomentum to finalize.\n\n\"Everything looks good. If we can get paperwork done by [date], we can start implementation [soon after].\"\n\n---\n\n## Urgency Messaging Frameworks\n\n### The Cost of Delay\n\n**Structure:**\n1. Acknowledge they're deciding\n2. Quantify ongoing cost/loss\n3. Show cumulative impact\n4. Offer next step\n\n**Example:**\n\"I understand you're weighing this decision. Based on what you shared, every month costs [X] in [lost productivity/revenue/etc]. Over a quarter, that's [3X]. Happy to discuss what's holding you back.\"\n\n### The Opportunity Window\n\n**Structure:**\n1. Present the opportunity\n2. Explain the window\n3. Show what closes if they wait\n4. Invite action\n\n**Example:**\n\"Right now, you could lock in [benefit]. After [date/event], [what changes]. Worth exploring before then?\"\n\n### The External Driver\n\n**Structure:**\n1. Reference external factor\n2. Connect to their situation\n3. Explain implications\n4. Offer help\n\n**Example:**\n\"With [industry trend/regulation/event] coming, companies in your space are moving faster. Is this on your radar?\"\n\n### The Social Proof Urgency\n\n**Structure:**\n1. Reference peer behavior\n2. Connect to their goals\n3. Create FOMO (gently)\n4. Offer next step\n\n**Example:**\n\"We've had several companies like yours sign up this month to get ahead of [challenge]. Shall I show you what they're seeing?\"\n\n---\n\n## Urgency in Bot Conversations\n\n### Natural Urgency Integration\n\n**Don't force it:**\nBad: \"LAST CHANCE! Sign up NOW before it's TOO LATE!\"\nGood: \"FYI, this pricing is available through [date]. Let me know if you have questions before then.\"\n\n**Weave into conversation:**\nBad: \"Buy now. Time is running out. Act today.\"\nGood: \"Based on your timeline, getting started before [date] makes sense. Here's what that would look like.\"\n\n### Conversational Urgency Triggers\n\n```\n// After showing value and detecting interest\nif (intent == \"interested\" && not_already_urgent) {\n  if (hasRealUrgencyFactor()) {\n    addUrgencyContext()\n  }\n}\n\nfunction addUrgencyContext() {\n  factors = getRealUrgencyFactors()\n\n  if (factors.includes(\"pricing_change\")) {\n    return \"FYI, this pricing is available through [date].\"\n  }\n\n  if (factors.includes(\"capacity_constraint\")) {\n    return \"Our implementation team is booking up—wanted to mention in case timing matters to you.\"\n  }\n\n  if (factors.includes(\"their_deadline\")) {\n    return \"You mentioned needing this by [date]. To hit that, we'd need to start by [earlier date].\"\n  }\n}\n```\n\n### Urgency Responses\n\n**To \"I'll think about it\":**\n\"Of course! Just wanted to mention [real urgency factor] in case timing matters to you.\"\n\n**To \"What if I wait?\":**\n\"That's totally fine. Here's what would be different: [honest answer about pricing, availability, etc.]\"\n\n**To \"Is this a limited time offer?\":**\n\"[Honest answer]. I'm not trying to pressure you—just want to make sure you have all the info.\"\n\n---\n\n## Ethical Boundaries\n\n### Do\n\n- Use real constraints\n- Be transparent about urgency\n- Connect urgency to their goals\n- Accept \"no\" or \"later\" gracefully\n- Provide accurate information\n\n### Don't\n\n- Create fake scarcity\n- Manufacture deadlines\n- Use fear-based manipulation\n- Apply excessive pressure\n- Lie about availability\n\n### Red Lines\n\n**Never:**\n- \"Only 2 left!\" (when not true)\n- Countdown timers that reset\n- \"Others are looking at this right now\" (made up)\n- Arbitrary deadlines for pressure\n- Fear-mongering\n\n---\n\n## Measuring Urgency Effectiveness\n\n### Key Metrics\n\n**Conversion:**\n- Response rate with/without urgency\n- Conversion rate with/without urgency\n- Time to decision with/without urgency\n\n**Quality:**\n- Customer satisfaction post-purchase\n- Buyer's remorse rate\n- Churn rate (urgency vs. non-urgency)\n\n**Trust:**\n- Trust survey scores\n- Repeat purchase rate\n- Referral rate\n\n### A/B Testing Urgency\n\n**Test:**\n- Urgency vs. no urgency\n- Different urgency types\n- Urgency timing\n- Urgency language\n\n**Measure:**\n- Short-term conversion\n- Long-term retention\n- Customer sentiment\n\n---\n\n## Urgency Templates\n\n### For Time Limits\n\n\"Just so you know, [offer/pricing/availability] is available through [specific date]. After that, [what changes]. No pressure—wanted to make sure you had that info.\"\n\n### For Capacity Limits\n\n\"Quick heads up: our [team/calendar/inventory] is filling up. If [their timeline] matters to you, we should probably finalize by [date]. Let me know if you want to secure a spot.\"\n\n### For Their Deadlines\n\n\"You mentioned wanting to [achieve goal] by [their date]. Working backward, that means we'd need to start [process] by [earlier date]. Does that timeline work for you?\"\n\n### For Cost of Delay\n\n\"While you're deciding, I wanted to mention: based on the [problem size] you shared, every [time period] this isn't solved costs roughly [amount]. Not to pressure you—just making sure you have the full picture.\"\n\n---\n\n## Common Mistakes\n\n### 1. Urgency Without Value\n**Problem:** Pushing urgency before establishing value\n**Fix:** Value first, urgency after interest established\n\n### 2. Fake Scarcity\n**Problem:** Making up deadlines or limitations\n**Fix:** Only use real constraints\n\n### 3. Constant Urgency\n**Problem:** Every message screams urgency\n**Fix:** Use sparingly, when genuine\n\n### 4. Ignoring Their Pace\n**Problem:** Pushing fast when they need time\n**Fix:** Match urgency to their buying process\n\n### 5. One-Size-Fits-All\n**Problem:** Same urgency tactics for everyone\n**Fix:** Personalize based on their situation and needs\n\n---\n\n## Implementation\n\n### Identify Real Urgency Factors\n\n```\nfunction getRealUrgencyFactors(context) {\n  factors = []\n\n  // Check for pricing changes\n  if (isPricingChangingSoon()) {\n    factors.push({\n      type: \"pricing_change\",\n      date: getPriceChangeDate(),\n      message: generatePricingUrgency()\n    })\n  }\n\n  // Check for capacity constraints\n  if (isCapacityConstrained()) {\n    factors.push({\n      type: \"capacity\",\n      availability: getNextAvailableSlot(),\n      message: generateCapacityUrgency()\n    })\n  }\n\n  // Check for their timeline\n  if (context.prospect_deadline) {\n    working_backward = calculateBackwardTimeline(context.prospect_deadline)\n    factors.push({\n      type: \"their_deadline\",\n      date: working_backward.decision_by,\n      message: generateTimelineUrgency(working_backward)\n    })\n  }\n\n  return factors\n}\n```\n\n### Apply Urgency Appropriately\n\n```\nfunction shouldAddUrgency(context) {\n  // Don't add urgency if:\n  if (context.conversation_stage \u003c \"consideration\") return false\n  if (context.urgency_already_mentioned) return false\n  if (context.sentiment == \"frustrated\") return false\n  if (!hasRealUrgencyFactor(context)) return false\n\n  // Do add urgency if:\n  if (context.showing_interest && !context.taking_action) return true\n  if (context.asked_about_timeline) return true\n\n  return false\n}\n```\n\n---\n\n## Questions to Ask\n\nIf you need more context:\n1. What legitimate urgency factors exist in your business?\n2. What's your sales cycle length?\n3. Have you used urgency tactics before? What happened?\n4. What are your buyers' typical objections to acting quickly?\n5. What's your brand's stance on sales pressure?\n\n---\n\n## Related Skills\n\n- **objection-recognition**: Handling \"not now\" objections\n- **conversational-flow-management**: Timing urgency in conversation\n- **closing**: Moving to commitment\n- **follow-up-discipline**: Urgency in follow-up\n"}]};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CALL = { design: 'DSN', marketing: 'MKT', sales: 'SLS', business: 'BIZ', ai: 'AI', projects: 'PRJ' };

const catById = Object.fromEntries(DATA.categories.map((c) => [c.id, c]));
DATA.skills.forEach((s) => {
  const peers = DATA.skills.filter((p) => p.category === s.category);
  s.call = (CALL[s.category] || s.category.slice(0, 3).toUpperCase()) + '·' + String(peers.indexOf(s) + 1).padStart(2, '0');
});

let state = { cat: 'all', q: '', open: null };
try { state.cat = localStorage.getItem('skills.cat') || 'all'; } catch (e) {}
if (state.cat !== 'all' && !catById[state.cat]) state.cat = 'all';

const own = DATA.skills.filter((s) => s.source === 'own').length;
$('owner-line').textContent = DATA.owner + ' · ' + DATA.repo;
$('lede').innerHTML = `<b>${DATA.skills.length} skills</b> in ${DATA.categories.length} shelves. ${own} written by Itai, the rest adapted or collected from open-source skill sets. Open any card to read the full instructions, or install a whole shelf into Claude Code.`;
$('cmd-add').textContent = `/plugin marketplace add ${DATA.repo}`;
$('repo-link').href = `https://github.com/${DATA.repo}`;
$('repo-link').textContent = `github.com/${DATA.repo}`;
$('foot-count').textContent = `${DATA.skills.length} skills · ${own} original`;

function matches(s) {
  if (state.cat !== 'all' && s.category !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return s.name.includes(q) || s.description.toLowerCase().includes(q);
}

function renderCats() {
  const counts = {};
  DATA.skills.forEach((s) => { counts[s.category] = (counts[s.category] || 0) + 1; });
  const items = [{ id: 'all', title: 'All shelves', n: DATA.skills.length }].concat(DATA.categories.map((c) => ({ id: c.id, title: c.title, n: counts[c.id] || 0 })));
  $('cats').innerHTML = items.map((c) => `<button class="cat" type="button" data-cat="${c.id}" aria-pressed="${state.cat === c.id}"><span>${esc(c.title)}</span><span class="n">${c.n}</span></button>`).join('');
}

function sourceTag(s) {
  const src = DATA.sources[s.source];
  return `<span class="tag ${s.source === 'own' ? 'own' : ''}">${esc(src.label)}</span>`;
}

function renderIndex() {
  const groups = DATA.categories.map((c) => ({ c, list: DATA.skills.filter((s) => s.category === c.id && matches(s)) })).filter((g) => g.list.length);
  if (!groups.length) { $('index').innerHTML = `<p class="empty">No skill matches “${esc(state.q)}”. Try a shorter word, or pick All shelves.</p>`; return; }
  $('index').innerHTML = groups.map(({ c, list }) => `
    <div class="group-h"><h2>${esc(c.title)}</h2><span>${esc(c.plugin)}</span></div>
    ${list.map((s) => `
      <button class="row" type="button" data-skill="${s.name}" aria-current="${state.open === s.name}">
        <span class="call">${s.call}</span>
        <span class="name">/${esc(s.name)} ${sourceTag(s)}</span>
        <span class="desc">${esc(s.description)}</span>
      </button>`).join('')}`).join('');
}

function renderMd(md) {
  if (!window.marked) return `<pre>${esc(md)}</pre>`;
  marked.use({ renderer: { html(t) { return esc(typeof t === 'string' ? t : t.text); } } });
  return marked.parse(md);
}

function renderCard() {
  const s = DATA.skills.find((x) => x.name === state.open);
  $('layout').classList.toggle('open', !!s);
  $('card').hidden = !s;
  if (!s) { $('card').innerHTML = ''; return; }
  const c = catById[s.category];
  const src = DATA.sources[s.source];
  const gh = `https://github.com/${DATA.repo}/tree/main/skills/${s.name}`;
  const installId = 'cmd-install';
  $('card').innerHTML = `
    <div class="card-head">
      <div class="card-top"><span class="eyebrow">${s.call} · ${esc(c.title)}</span><button class="close" type="button" id="close">Close</button></div>
      <h3>/${esc(s.name)}${s.argumentHint ? ` <span style="font:400 15px var(--mono);color:var(--muted)">${esc(s.argumentHint)}</span>` : ''}</h3>
      <p class="about">${esc(s.description)}</p>
      <div class="cmd"><code id="${installId}">/plugin install ${esc(c.plugin)}@${esc(DATA.marketplace)}</code><button class="copy" type="button" data-copy="${installId}">Copy</button></div>
      <dl class="facts">
        <dt>Source</dt><dd>${esc(src.label)}${src.url ? ` · <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.url.replace('https://github.com/', ''))}</a>` : ''}</dd>
        <dt>Licence</dt><dd>${esc(src.license)}</dd>
        ${s.note || src.note ? `<dt>Note</dt><dd>${esc(s.note || src.note)}</dd>` : ''}
        <dt>Files</dt><dd class="files">${s.files.map(esc).join(' · ')}</dd>
        <dt>Repo</dt><dd><a href="${gh}" target="_blank" rel="noopener">skills/${esc(s.name)}</a></dd>
      </dl>
    </div>
    <div class="md">${renderMd(s.body)}</div>`;
  $('card').scrollTop = 0;
}

function render() { renderCats(); renderIndex(); renderCard(); }

function open(name) {
  state.open = name;
  try { history.replaceState(null, '', name ? '#' + name : location.pathname); } catch (e) {}
  renderIndex(); renderCard();
}

document.addEventListener('click', async (e) => {
  const cat = e.target.closest('[data-cat]');
  if (cat) { state.cat = cat.dataset.cat; try { localStorage.setItem('skills.cat', state.cat); } catch (err) {} renderCats(); renderIndex(); return; }
  const row = e.target.closest('[data-skill]');
  if (row) { open(row.dataset.skill); return; }
  if (e.target.id === 'close') { open(null); return; }
  const btn = e.target.closest('[data-copy]');
  if (btn) {
    const el = $(btn.dataset.copy);
    try { await navigator.clipboard.writeText(el.textContent); btn.textContent = 'Copied'; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Selected'; }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
  }
});
$('q').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderIndex(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) open(null); });

const fromHash = decodeURIComponent(location.hash.slice(1));
if (DATA.skills.some((s) => s.name === fromHash)) state.open = fromHash;
render();
</script>
